<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="晕倒料理">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/SxcvL0Qq/IMG-9251.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.postimg.cc/SxcvL0Qq/IMG-9251.jpg">
    <link rel="icon" href="https://i.postimg.cc/SxcvL0Qq/IMG-9251.jpg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <title>晕倒料理</title>
    <script>
        // 每次打开都显示开屏动画，但避免从splash.html或Settings、Theme、Music页面跳转回来时的循环
        if (!document.referrer.includes('splash.html') && !document.referrer.includes('Settings/') && !document.referrer.includes('Theme/') && !document.referrer.includes('Music/')) {
            window.location.href = 'splash.html';
        }
        
        // 加载保存的壁纸
        window.addEventListener('load', function() {
            const savedWallpaperData = localStorage.getItem('wallpaperData');
            const backgroundContainer = document.querySelector('.background-container');
            if (savedWallpaperData && backgroundContainer) {
                const data = JSON.parse(savedWallpaperData);
                backgroundContainer.style.backgroundImage = `url(${data.url})`;
                // 将百分比转换为模糊半径（0-20px）
                const blurRadius = (data.blur || 0) / 100 * 20;
                backgroundContainer.style.filter = `blur(${blurRadius}px)`;
            }
            
            // 加载保存的字体
            const savedFont = localStorage.getItem('current_font');
            if (savedFont) {
                const font = JSON.parse(savedFont);
                if (font.url) {
                    // 移除旧的字体样式
                    const oldFontStyle = document.getElementById('custom-font-style');
                    if (oldFontStyle) {
                        oldFontStyle.remove();
                    }
                    
                    // 创建新的样式标签，使用@font-face加载TTF字体
                    const fontStyle = document.createElement('style');
                    fontStyle.id = 'custom-font-style';
                    
                    // 使用保存的字体名称或生成唯一名称
                    const fontName = font.family || font.name || 'CustomFont';
                    
                    // 构建@font-face规则
                    const fontFaceRule = `
                        @font-face {
                            font-family: '${fontName}';
                            src: url('${font.url}') format('truetype');
                            font-weight: normal;
                            font-style: normal;
                        }
                    `;
                    
                    fontStyle.textContent = fontFaceRule;
                    document.head.appendChild(fontStyle);
                    
                    // 应用字体
                    document.body.style.fontFamily = fontName;
                } else if (font.family) {
                    document.body.style.fontFamily = font.family;
                }
            }
        });
    </script>
</head>

            <div class="content-section">

    <script>
        // 添加触摸事件支持，确保在手机端也能正常触发动画
        document.addEventListener('DOMContentLoaded', function() {
            const appIcons = document.querySelectorAll('.app-icon');
            
            appIcons.forEach(icon => {
                icon.addEventListener('touchstart', function() {
                    this.classList.add('touch-active');
                });
                
                icon.addEventListener('touchend', function() {
                    setTimeout(() => {
                        this.classList.remove('touch-active');
                    }, 100);
                });
                
                icon.addEventListener('touchcancel', function() {
                    this.classList.remove('touch-active');
                });
            });
            
            // 小组件功能
            // 头像上传功能
            const avatar = document.getElementById('avatar');
            const avatarUpload = document.getElementById('avatar-upload');
            
            if (avatar && avatarUpload) {
                avatar.addEventListener('click', function() {
                    avatarUpload.click();
                });
                
                avatarUpload.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const img = avatar.querySelector('img');
                            img.src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
            
            // 昵称和ID编辑功能
            const nickname = document.getElementById('nickname');
            const id = document.getElementById('id');
            
            if (nickname) {
                nickname.addEventListener('blur', function() {
                    if (!this.textContent.trim()) {
                        this.textContent = '晕了饱饱';
                    }
                });
            }
            
            if (id) {
                id.addEventListener('blur', function() {
                    if (!this.textContent.trim()) {
                        this.textContent = '@Q_iian';
                    }
                });
            }
            
            // 内容编辑功能
            const content = document.getElementById('content');
            
            if (content) {
                content.addEventListener('blur', function() {
                    if (!this.textContent.trim()) {
                        this.textContent = '拥有苹果时 只在意苹果';
                    }
                });
            }
            
            // 表情/图标固定为红苹果，禁止替换修改
            const emoji = document.getElementById('emoji');
            
            if (emoji) {
                emoji.textContent = '🍎';
            }
            
            // Dock标签编辑功能
            const dockLabel = document.getElementById('dock-label');
            
            if (dockLabel) {
                dockLabel.addEventListener('blur', function() {
                    if (!this.textContent.trim()) {
                        this.textContent = '౿ ‧₊見えない愛ഒ ‧₊˚';
                    }
                });
            }
            
            // 阻止编辑时的默认行为
            const editableElements = document.querySelectorAll('[contenteditable="true"]');
            editableElements.forEach(element => {
                element.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                    }
                });
            });
            
            // 为dock栏图标添加点击事件
            const dockIcons = document.querySelectorAll('.dock .app-icon');
            if (dockIcons.length > 0) {
                // 第二个图标（从左往右）跳转到Music界面
                const secondDockIcon = dockIcons[1];
                secondDockIcon.addEventListener('click', function() {
                    window.location.href = 'Music/music.html';
                });
                // 添加触摸事件支持
                secondDockIcon.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    window.location.href = 'Music/music.html';
                });
                
                // 第三个图标（从左往右）跳转到Theme界面
                const thirdDockIcon = dockIcons[2];
                thirdDockIcon.addEventListener('click', function() {
                    window.location.href = 'Theme/theme.html';
                });
                // 添加触摸事件支持
                thirdDockIcon.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    window.location.href = 'Theme/theme.html';
                });
                
                // 最右边图标跳转到settings页面
                const lastDockIcon = dockIcons[dockIcons.length - 1];
                lastDockIcon.addEventListener('click', function() {
                    window.location.href = 'Settings/Settings.html';
                });
                // 添加触摸事件支持
                lastDockIcon.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    window.location.href = 'Settings/Settings.html';
                });
            }
        });
    </script>
</body>
</html>
