<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>晕倒料理</title>
	<link rel="stylesheet" href="style.css" />
	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#ffffff">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="晕倒料理">
	<meta name="format-detection" content="telephone=no">
</head>
<body>
	<div class="device">
		<main class="home-screen" aria-label="主屏幕">
			<nav class="dock" aria-label="底部 Dock 栏">
				<button class="dock-app" type="button" aria-label="电话">
					<span class="app-icon" aria-hidden="true"></span>
					<span class="app-label">电话</span>
				</button>
				<button class="dock-app" type="button" aria-label="信息">
					<span class="app-icon" aria-hidden="true"></span>
					<span class="app-label">信息</span>
				</button>
				<button class="dock-app" type="button" aria-label="主题">
					<span class="app-icon" aria-hidden="true"></span>
					<span class="app-label">主题</span>
				</button>
				<button class="dock-app" type="button" aria-label="设置">
					<span class="app-icon" aria-hidden="true"></span>
					<span class="app-label">设置</span>
				</button>
			</nav>
		</main>
	</div>

	<script src="script.js"></script>
	<script>
		if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
			document.documentElement.classList.add('is-standalone');
		} else if (window.navigator.standalone) {
			document.documentElement.classList.add('is-standalone');
		}
	</script>
</body>
</html>
