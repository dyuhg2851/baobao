<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>晕倒料理</title>
	<link rel="stylesheet" href="style.css" />
	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#ffffff">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="晕倒料理">
	<meta name="format-detection" content="telephone=no">
</head>
<body>
	<!-- 纯内容容器：用于在 Live Server 中模拟 iPhone 15 Plus（430×932） -->
	<div class="device" role="application">
		<!-- 主屏幕空白区（你后续可以在这里放聊天界面） -->
		<main class="home-screen" aria-hidden="false"></main>

		<!-- Dock：半透明磨砂玻璃，四个 app（电话、信息、主题、设置） -->
		<nav class="dock" aria-label="Dock">
			<button class="dock-item" aria-label="电话">
				<span class="icon" aria-hidden="true"></span>
				<span class="label">电话</span>
			</button>
			<button class="dock-item" aria-label="信息">
				<span class="icon" aria-hidden="true"></span>
				<span class="label">信息</span>
			</button>
			<button class="dock-item" aria-label="主题">
				<span class="icon" aria-hidden="true"></span>
				<span class="label">主题</span>
			</button>
			<button class="dock-item" aria-label="设置">
				<span class="icon" aria-hidden="true"></span>
				<span class="label">设置</span>
			</button>
		</nav>
	</div>

	<script src="script.js"></script>
	<script>
		if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
			document.documentElement.classList.add('is-standalone');
		} else if (window.navigator.standalone) {
			document.documentElement.classList.add('is-standalone');
		}
	</script>
</body>
</html>
