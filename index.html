<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="晕倒料理">
    <title>晕倒料理</title>
    <link rel="apple-touch-icon" href="https://i.postimg.cc/Jn63yqvs/IMG-9251.jpg">
    <link rel="icon" href="https://i.postimg.cc/Jn63yqvs/IMG-9251.jpg">
    <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
    <div class="main-screen">
        <div class="slide-container">
            <div class="slide-page">
                <div class="app-grid">
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/pLWZSKkg/IMG-9922.png" alt="微信" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">微信</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/DzSFhJBF/IMG-9940.png" alt="家庭" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">家庭</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon full-icon"><img src="https://i.postimg.cc/HkWL7Ls8/quality-restoration-20260321211820358.png" alt="查找" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">查找</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/SKQvcwwK/IMG-9926.png" alt="音乐" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">音乐</div>
                    </div>
                </div>
            </div>
            <div class="slide-page"></div>
        </div>
        <div class="page-indicator">
            <div class="indicator-dot active"></div>
            <div class="indicator-dot"></div>
        </div>
        <div class="dock">
        <div class="dock-item">
            <div class="dock-icon"><img src="https://i.postimg.cc/zXnt6zNS/IMG-9923.png" alt="信息" loading="lazy" width="36" height="36"></div>
        </div>
        <div class="dock-item">
            <div class="dock-icon"><img src="https://i.postimg.cc/SKtDCjLF/IMG-9924.png" alt="相机" loading="lazy" width="36" height="36"></div>
        </div>
        <div class="dock-item">
            <div class="dock-icon full-icon"><img src="https://i.postimg.cc/kMSfRJBj/IMG-9927.png" alt="主题" loading="lazy" width="36" height="36"></div>
        </div>
        <div class="dock-item" id="settings-icon">
            <div class="dock-icon"><img src="https://i.postimg.cc/RFFL0m2p/IMG-9925.png" alt="设置" loading="lazy" width="36" height="36"></div>
        </div>
        </div>
    </div>
    
    <!-- 设置页面容器 -->
    <div id="settings-page" class="settings-page">
        <!-- 顶部导航栏 -->
        <div class="settings-header">
            <div class="back-button" onclick="goBack()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </div>
            <h1 class="settings-title">设置</h1>
            <div class="header-right"></div>
        </div>
        
        <!-- 搜索栏 -->
        <div class="search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="搜索" class="search-input">
        </div>
        
        <!-- 个人信息卡片 -->
        <div class="profile-card" onclick="editProfile()">
            <div class="profile-avatar" onclick="changeAvatar(event)">
                <img id="avatar-image" src="" alt="头像">
            </div>
            <div class="profile-info">
                <div class="profile-name" onclick="editName(event)">晕倒</div>
                <div class="profile-desc" onclick="editDescription(event)">Apple账户、iCloud等</div>
            </div>
            <div class="profile-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
        </div>
        
        <!-- 第一组设置 -->
        <div class="settings-group">
            <div class="settings-item">
                <div class="settings-icon settings-icon-orange" data-icon-url=""></div>
                <div class="settings-label">飞行模式</div>
                <div class="settings-toggle">
                    <input type="checkbox" id="airplane-mode" class="toggle-input">
                    <label for="airplane-mode" class="toggle-label"></label>
                </div>
            </div>
            <div class="settings-item" onclick="goToWifiPage()">
                <div class="settings-icon settings-icon-blue" data-icon-url=""></div>
                <div class="settings-label">无线局域网</div>
                <div class="settings-value">kakashi</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-blue" data-icon-url=""></div>
                <div class="settings-label">蓝牙</div>
                <div class="settings-value">开启</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-green" data-icon-url=""></div>
                <div class="settings-label">蜂窝网络</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-green" data-icon-url=""></div>
                <div class="settings-label">个人热点</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-green" data-icon-url=""></div>
                <div class="settings-label">电池</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-blue" data-icon-url=""></div>
                <div class="settings-label">VPN</div>
                <div class="settings-toggle">
                    <input type="checkbox" id="vpn-toggle" class="toggle-input">
                    <label for="vpn-toggle" class="toggle-label"></label>
                </div>
            </div>
        </div>
        
        <!-- 第二组设置 -->
        <div class="settings-group">
            <div class="settings-item" onclick="goToGeneralPage()">
                <div class="settings-icon settings-icon-gray" data-icon-url=""></div>
                <div class="settings-label">通用</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item" onclick="openWallpaperPage()">
                <div class="settings-icon settings-icon-blue" data-icon-url=""></div>
                <div class="settings-label">壁纸</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-blue" data-icon-url=""></div>
                <div class="settings-label">显示与美化</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-red" data-icon-url=""></div>
                <div class="settings-label">通知</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 无线局域网子页面 -->
    <div id="wifi-page" class="settings-page">
        <!-- 顶部导航栏 -->
        <div class="settings-header">
            <div class="back-button" onclick="goBackFromWifi()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </div>
            <h1 class="settings-title">无线局域网</h1>
            <div class="header-right"></div>
        </div>
        
        <!-- 搜索栏 -->
        <div class="search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="搜索网络" class="search-input">
        </div>
        
        <!-- API配置和模型选择部分 -->
        <div class="settings-group">
            <div class="settings-item">
                <div class="settings-label">URL</div>
                <input type="url" id="api-url" placeholder="输入接口地址" class="settings-input">
            </div>
            <div class="settings-item">
                <div class="settings-label">API key</div>
                <input type="password" id="api-key" placeholder="输入API密钥" class="settings-input">
            </div>
            <div class="settings-item">
                <div class="settings-label">选择模型</div>
                <div id="selected-model" class="settings-value">请先拉取模型</div>
                <div class="settings-arrow" onclick="openModelSelector()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item buttons-row">
                <button class="settings-button" onclick="fetchModels()">拉取模型</button>
                <button class="settings-button" onclick="openAddPresetDialog()">添加API预设</button>
            </div>
        </div>
        
        <!-- API预设部分 -->
        <div class="settings-group">
            <div class="settings-group-title">API预设</div>
            <div id="preset-list" class="preset-avatars">
                <!-- 预设列表将动态生成 -->
            </div>
        </div>
        
        <!-- 模型选择弹窗 -->
        <div id="model-selector" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>选择模型</h3>
                    <button class="modal-close" onclick="closeModelSelector()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="model-list">
                        <!-- 模型列表将动态生成 -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 添加API预设弹窗 -->
        <div id="add-preset-dialog" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>添加API预设</h3>
                    <button class="modal-close" onclick="closeAddPresetDialog()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="modal-form-item">
                        <label>预设名称</label>
                        <input type="text" id="preset-name" placeholder="输入预设名称">
                    </div>
                    <div class="modal-form-item">
                        <label>API密钥</label>
                        <input type="password" id="preset-api-key" placeholder="输入API密钥">
                    </div>
                    <div class="modal-form-item">
                        <label>接口地址</label>
                        <input type="url" id="preset-api-url" placeholder="输入接口地址">
                    </div>
                    <div class="modal-actions">
                        <button class="modal-button cancel" onclick="closeAddPresetDialog()">取消</button>
                        <button class="modal-button confirm" onclick="saveApiPreset()">保存</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 壁纸选择页面 -->
    <div id="wallpaper-page" class="settings-page">
        <!-- 顶部导航栏 -->
        <div class="settings-header">
            <div class="back-button" onclick="goBackFromWallpaper()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </div>
            <h1 class="settings-title">壁纸</h1>
            <div class="header-right"></div>
        </div>
        
        <!-- 壁纸选择部分 -->
        <div class="settings-group">
            <div class="settings-item" onclick="openPhotoLibrary()">
                <div class="settings-label">从相册选择</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
        </div>
        
        <!-- 壁纸预览部分 -->
        <div class="wallpaper-preview">
            <h3 class="wallpaper-preview-title">预览</h3>
            <div class="blur-adjuster">
                <div class="blur-label">模糊度</div>
                <input type="range" id="blur-slider" min="0" max="10" value="0" step="0.5">
                <div id="blur-value" class="blur-value">0%</div>
            </div>
            <div id="wallpaper-preview-container" class="wallpaper-preview-container">
                <!-- 壁纸预览将在这里显示 -->
            </div>
        </div>
    </div>
    
    <!-- 壁纸确认弹窗 -->
    <div id="wallpaper-confirm-dialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>设置壁纸</h3>
                <button class="modal-close" onclick="closeWallpaperConfirmDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="wallpaper-confirm-preview"></div>
                <div class="modal-actions">
                    <button class="modal-button cancel" onclick="closeWallpaperConfirmDialog()">取消</button>
                    <button class="modal-button confirm" onclick="setWallpaper()">设为主屏幕</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 通用页面 -->
    <div id="general-page" class="settings-page">
        <!-- 顶部导航栏 -->
        <div class="settings-header">
            <div class="back-button" onclick="goBackFromGeneral()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </div>
            <h1 class="settings-title">通用</h1>
            <div class="header-right"></div>
        </div>
        
        <!-- 世界书管理模块 -->
        <div class="settings-group">
            <div class="settings-group-title">世界书管理</div>
            <div class="world-book-header">
                <h3>世界书</h3>
                <button class="add-world-book-button" onclick="openAddWorldBookDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    添加
                </button>
            </div>
            <div id="world-book-list" class="world-book-grid">
                <!-- 世界书列表将动态生成 -->
            </div>
        </div>
        
        <!-- 备份与恢复模块 -->
        <div class="settings-group" style="margin-top: auto;">
            <div class="settings-group-title">备份与恢复</div>
            <div class="settings-item" onclick="openBackupDialog()">
                <div class="settings-label">备份全部数据</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item" onclick="openRestoreDialog()">
                <div class="settings-label">从文件恢复</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加世界书弹窗 -->
    <div id="add-world-book-dialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加世界书</h3>
                <button class="modal-close" onclick="closeAddWorldBookDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-form-item">
                    <label>世界书名称</label>
                    <input type="text" id="world-book-name" placeholder="输入世界书名称">
                </div>
                <div class="modal-form-item">
                    <label>世界书内容</label>
                    <textarea id="world-book-content" placeholder="输入世界书内容" rows="4"></textarea>
                </div>
                <div class="modal-form-item">
                    <label>全局使用</label>
                    <div class="settings-toggle" style="margin-left: auto;">
                        <input type="checkbox" id="world-book-global" class="toggle-input">
                        <label for="world-book-global" class="toggle-label"></label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="modal-button cancel" onclick="closeAddWorldBookDialog()">取消</button>
                    <button class="modal-button confirm" onclick="saveWorldBook()">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 编辑世界书弹窗 -->
    <div id="edit-world-book-dialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑世界书</h3>
                <button class="modal-close" onclick="closeEditWorldBookDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-form-item">
                    <label>世界书名称</label>
                    <input type="text" id="edit-world-book-name" placeholder="输入世界书名称">
                </div>
                <div class="modal-form-item">
                    <label>世界书内容</label>
                    <textarea id="edit-world-book-content" placeholder="输入世界书内容" rows="4"></textarea>
                </div>
                <div class="modal-form-item">
                    <label>全局使用</label>
                    <div class="settings-toggle" style="margin-left: auto;">
                        <input type="checkbox" id="edit-world-book-global" class="toggle-input">
                        <label for="edit-world-book-global" class="toggle-label"></label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="modal-button cancel" onclick="closeEditWorldBookDialog()">取消</button>
                    <button class="modal-button confirm" onclick="updateWorldBook()">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 备份弹窗 -->
    <div id="backup-dialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>备份数据</h3>
                <button class="modal-close" onclick="closeBackupDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-form-item">
                    <label>备份文件名</label>
                    <input type="text" id="backup-filename" value="好好吃的料理.json" placeholder="输入备份文件名">
                </div>
                <div class="modal-actions">
                    <button class="modal-button cancel" onclick="closeBackupDialog()">取消</button>
                    <button class="modal-button confirm" onclick="downloadBackup()">确认</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 恢复确认弹窗 -->
    <div id="restore-confirm-dialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>恢复数据</h3>
                <button class="modal-close" onclick="closeRestoreConfirmDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 20px;">恢复将覆盖当前所有数据，是否继续？</p>
                <div class="modal-actions">
                    <button class="modal-button cancel" onclick="closeRestoreConfirmDialog()">取消</button>
                    <button class="modal-button confirm" onclick="restoreData()">继续</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 长按菜单 -->
    <div id="context-menu" class="context-menu">
        <div class="context-menu-item" onclick="deleteWorldBook()">删除</div>
    </div>
    
    <!-- 文件输入框（用于恢复） -->
    <input type="file" id="restore-file-input" accept=".json" style="display: none;">
    
    <script src="script.js?v=1.0.0"></script>
</body>
</html>
