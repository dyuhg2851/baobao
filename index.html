    <title>晕倒料理</title>
    <script>
        // 立即同步加载壁纸，避免闪烁
        (function() {
            try {
                const savedWallpaperData = localStorage.getItem('wallpaperData');
                if (savedWallpaperData) {
                    const data = JSON.parse(savedWallpaperData);
                    if (data.url) {
                        const blurRadius = Math.min((data.blur || 0) / 100 * 20, 20);
                        // 使用内联样式立即设置背景，避免闪烁
                        document.write(`<style id="wallpaper-style">
                            .background-container { 
                                background-image: url(${data.url}); 
                                filter: blur(${blurRadius}px); 
                                background-color: transparent;
                                opacity: 1;
                            }
                            html, body {
                                background-color: transparent;
                            }
                        </style>`);
                        
                        // 预加载图片以避免后续切换时闪烁
                        const img = new Image();
                        img.src = data.url;
                    }
                }
            } catch(e) {
                console.error('Failed to load wallpaper:', e);
            }
        })();
        
        // 全局音频播放器 - 在页面间共享播放
        window.musicAudio = document.createElement('audio');
        window.musicAudio.setAttribute('playsinline', '');
        window.musicAudio.setAttribute('webkit-playsinline', '');
        window.musicAudio.style.display = 'none';
        document.body.appendChild(window.musicAudio);
        
        // 从localStorage恢复音乐播放状态
        function resumeMusicPlayback() {
            const savedState = localStorage.getItem('music_audio_state');
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    if (state.isPlaying && state.currentSong && state.currentSong.musicUrl) {
                        window.musicAudio.src = state.currentSong.musicUrl;
                        window.musicAudio.currentTime = state.currentTime;
                        window.musicAudio.play().then(() => {
                            console.log('音乐在主页继续播放');
                        }).catch(err => {
                            console.warn('主页音乐播放失败:', err);
                        });
                    }
                } catch(e) {
                    console.error('恢复音乐播放失败:', e);
                }
            }
        }
        
        // DOM加载完成后执行其他初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 尝试恢复音乐播放
            resumeMusicPlayback();
            
            // 北京时间格式化函数 (UTC+8) - 使用Intl确保准确的时区转换
            window.formatBeijingTime = function(date) {
                if (!(date instanceof Date)) {
                    date = new Date(date);
                }
                
                const formatter = new Intl.DateTimeFormat('zh-CN', {
                    timeZone: 'Asia/Shanghai',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });
                
                const parts = formatter.formatToParts(date);
                let result = {
                    year: '',
                    month: '',
                    day: '',
                    hours: '',
                    minutes: '',
                    date: new Date(date.toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }))
                };
                
                parts.forEach(part => {
                    switch(part.type) {
                        case 'year': result.year = part.value; break;
                        case 'month': result.month = part.value; break;
                        case 'day': result.day = part.value; break;
                        case 'hour': result.hours = part.value; break;
                        case 'minute': result.minutes = part.value; break;
                    }
                });
                
                return result;
            };
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var gridLinks = ['Chat/chat.html', 'Family/family.html', 'Search/search.html', 'Focus/focus.html'];
            var dockLinks = ['Secret/secret.html', 'Music/music.html', 'Theme/theme.html', 'Settings/Settings.html'];
            
            var appGrid = document.querySelector('.app-grid');
            var dock = document.querySelector('.dock');
            
            if (appGrid) {
                appGrid.addEventListener('click', function(e) {
                    var icon = e.target.closest('.app-icon');
                    if (!icon) return;
                    var icons = [].slice.call(appGrid.querySelectorAll('.app-icon'));
                    var index = icons.indexOf(icon);
                    if (index >= 0 && gridLinks[index]) {
                        e.preventDefault();
                        icon.style.transition = 'transform 0.08s ease';
                        icon.style.transform = 'scale(0.92)';
                        setTimeout(function() {
                            location.replace(gridLinks[index]);
                        }, 60);
                    }
                });
            }
            
            if (dock) {
                dock.addEventListener('click', function(e) {
                    var icon = e.target.closest('.app-icon');
                    if (!icon) return;
                    var icons = [].slice.call(dock.querySelectorAll('.app-icon'));
                    var index = icons.indexOf(icon);
                    if (index >= 0 && dockLinks[index]) {
                        e.preventDefault();
                        icon.style.transition = 'transform 0.08s ease';
                        icon.style.transform = 'scale(0.92)';
                        setTimeout(function() {
                            location.replace(dockLinks[index]);
                        }, 60);
                    }
                });
            }
            
            setTimeout(function() {
                var avatar = document.getElementById('avatar');
                var avatarUpload = document.getElementById('avatar-upload');

                var savedUserProfile = localStorage.getItem('profile_user');
                if (savedUserProfile && avatar) {
                    try {
                        var userProfile = JSON.parse(savedUserProfile);
                        if (userProfile.avatar) {
                            var img = avatar.querySelector('img');
                            if (img) img.src = userProfile.avatar;
                        }
                    } catch (e) {
                        console.error('解析 profile_user 失败', e);
                    }
                }

                if (avatar && avatarUpload) {
                    avatar.addEventListener('click', function() { avatarUpload.click(); });
                    avatarUpload.addEventListener('change', function(e) {
                        var file = e.target.files && e.target.files[0];
                        if (file) {
                            var reader = new FileReader();
                            reader.onload = function(event) {
                                var img = avatar.querySelector('img');
                                if (img && event.target) {
                                    img.src = event.target.result;
                                    var existingProfile = localStorage.getItem('profile_user');
                                    var profileData = { avatar: event.target.result, name: '', signature: '', settings: '' };
                                    if (existingProfile) {
                                        try {
                                            var parsed = JSON.parse(existingProfile);
                                            profileData.name = parsed.name || '';
                                            profileData.signature = parsed.signature || '';
                                            profileData.settings = parsed.settings || '';
                                        } catch (err) {
                                            console.warn('解析 profile_user 失败');
                                        }
                                    }
                                    localStorage.setItem('profile_user', JSON.stringify(profileData));
                                }
                            };
                            reader.readAsDataURL(file);
                        }
                    });
                }

                var dockLabel = document.getElementById('dock-label');
                if (dockLabel) {
                    dockLabel.addEventListener('blur', function() {
                        if (!dockLabel.textContent.trim()) {
                            dockLabel.textContent = '౿ ‧₊見えない愛ഒ ‧₊˚';
                        }
                    });
                }
                
                var editables = document.querySelectorAll('[contenteditable="true"]');
                for (var i = 0; i < editables.length; i++) {
                    editables[i].addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') e.preventDefault();
                    });
                }
            }, 100);
        });
    </script>
