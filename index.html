<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iPhone 15 Plus 容器">
    <title>iPhone 15 Plus 容器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-screen">
        <div class="slide-container">
            <div class="slide-page">
                <div class="app-grid">
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/pLWZSKkg/IMG-9922.png" alt="微信" style="width: 100%; height: 100%; border-radius: 10.5px;"></div>
                        <div class="app-label">微信</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/WtRyrtvF/Home-i-OS-1024x1024.png" alt="家庭" style="width: 100%; height: 100%; border-radius: 10.5px;"></div>
                        <div class="app-label">家庭</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/vZrJr7Tq/cha-zhao-i-OS-1024x1024.png" alt="查找" style="width: 100%; height: 100%; border-radius: 10.5px;"></div>
                        <div class="app-label">查找</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/SKQvcwwK/IMG-9926.png" alt="音乐" style="width: 100%; height: 100%; border-radius: 10.5px;"></div>
                        <div class="app-label">音乐</div>
                    </div>
                </div>
            </div>
            <div class="slide-page"></div>
        </div>
        <div class="page-indicator">
            <div class="indicator-dot active"></div>
            <div class="indicator-dot"></div>
        </div>
        <div class="dock">
        <div class="dock-item">
            <div class="dock-icon"><img src="https://i.postimg.cc/zXnt6zNS/IMG-9923.png" alt="信息" style="width: 100%; height: 100%; border-radius: 10.5px;"></div>
        </div>
        <div class="dock-item">
            <div class="dock-icon"><img src="https://i.postimg.cc/SKtDCjLF/IMG-9924.png" alt="相机" style="width: 100%; height: 100%; border-radius: 10.5px;"></div>
        </div>
        <div class="dock-item">
            <div class="dock-icon"><img src="https://i.postimg.cc/kMSfRJBj/IMG-9927.png" alt="主题" style="width: 100%; height: 100%; border-radius: 10.5px;"></div>
        </div>
        <div class="dock-item" id="settings-icon">
            <div class="dock-icon"><img src="https://i.postimg.cc/RFFL0m2p/IMG-9925.png" alt="设置" style="width: 100%; height: 100%; border-radius: 10.5px;"></div>
        </div>
        </div>
    </div>
    
    <!-- 设置页面容器 -->
    <div id="settings-page" class="settings-page">
        <!-- 顶部导航栏 -->
        <div class="settings-header">
            <div class="back-button" onclick="goBack()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </div>
            <h1 class="settings-title">设置</h1>
            <div class="header-right"></div>
        </div>
        
        <!-- 搜索栏 -->
        <div class="search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="搜索" class="search-input">
        </div>
        
        <!-- 个人信息卡片 -->
        <div class="profile-card" onclick="editProfile()">
            <div class="profile-avatar" onclick="changeAvatar(event)">
                <img id="avatar-image" src="" alt="头像">
            </div>
            <div class="profile-info">
                <div class="profile-name" onclick="editName(event)">晕倒</div>
                <div class="profile-desc" onclick="editDescription(event)">Apple账户、iCloud等</div>
            </div>
            <div class="profile-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
        </div>
        
        <!-- 第一组设置 -->
        <div class="settings-group">
            <div class="settings-item">
                <div class="settings-icon settings-icon-orange" data-icon-url=""></div>
                <div class="settings-label">飞行模式</div>
                <div class="settings-toggle">
                    <input type="checkbox" id="airplane-mode" class="toggle-input">
                    <label for="airplane-mode" class="toggle-label"></label>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-blue" data-icon-url=""></div>
                <div class="settings-label">无线局域网</div>
                <div class="settings-value">kakashi</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-blue" data-icon-url=""></div>
                <div class="settings-label">蓝牙</div>
                <div class="settings-value">开启</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-green" data-icon-url=""></div>
                <div class="settings-label">蜂窝网络</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-green" data-icon-url=""></div>
                <div class="settings-label">个人热点</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-green" data-icon-url=""></div>
                <div class="settings-label">电池</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-blue" data-icon-url=""></div>
                <div class="settings-label">VPN</div>
                <div class="settings-toggle">
                    <input type="checkbox" id="vpn-toggle" class="toggle-input">
                    <label for="vpn-toggle" class="toggle-label"></label>
                </div>
            </div>
        </div>
        
        <!-- 第二组设置 -->
        <div class="settings-group">
            <div class="settings-item">
                <div class="settings-icon settings-icon-gray" data-icon-url=""></div>
                <div class="settings-label">通用</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-blue" data-icon-url=""></div>
                <div class="settings-label">壁纸</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-blue" data-icon-url=""></div>
                <div class="settings-label">显示与美化</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon settings-icon-red" data-icon-url=""></div>
                <div class="settings-label">通知</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
