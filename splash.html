<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>开屏动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .svg-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .svg-large {
            position: absolute;
            width: 300px;
            height: 300px;
            opacity: 0.3;
        }
        
        .svg-regular {
            position: relative;
            width: 150px;
            height: 150px;
            z-index: 1;
        }
        
        path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 2s ease forwards;
        }
        
        .svg-large path {
            stroke: #ccc;
            animation-duration: 1.5s;
        }
        
        .svg-regular path {
            stroke: #000;
            animation-duration: 2.5s;
            animation-delay: 0.3s;
        }
        
        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }
        
        .fade-out {
            animation: fadeOut 1s ease forwards;
            animation-delay: 4s;
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="splash-container" id="splash-container">
        <div class="svg-container">
            <svg class="svg-large" xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 24 24">
                <path fill="none" stroke="#ccc" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11.953 2C17.502 2 22 6.477 22 12s-4.498 10-10.047 10C-.63 22-1.827 4.018 11.5 5c3.35.247 6.53 3.41 6.53 7c0 4.5-2.794 6.5-6.53 6.5c-7 0-8.31-10.033-.498-9.5c1.506.103 3.014 1.343 3.014 3c0 1.928-1.016 3-2.895 3"/>
            </svg>
            <svg class="svg-regular" xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 24 24">
                <path fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11.953 2C17.502 2 22 6.477 22 12s-4.498 10-10.047 10C-.63 22-1.827 4.018 11.5 5c3.35.247 6.53 3.41 6.53 7c0 4.5-2.794 6.5-6.53 6.5c-7 0-8.31-10.033-.498-9.5c1.506.103 3.014 1.343 3.014 3c0 1.928-1.016 3-2.895 3"/>
            </svg>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const splashContainer = document.getElementById('splash-container');
            
            // 计算SVG路径的实际长度并设置动画参数
            const paths = document.querySelectorAll('path');
            paths.forEach(path => {
                const length = path.getTotalLength();
                path.style.strokeDasharray = length;
                path.style.strokeDashoffset = length;
            });
            
            // 添加淡出动画
            splashContainer.classList.add('fade-out');
            
            // 动画结束后跳转到主页面
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 5000);
        });
    </script>
</body>
</html>
