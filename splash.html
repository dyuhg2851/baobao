<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>开屏动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
        }

        body {
            background-color: #ffffff;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .splash-container {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            z-index: 9999;
            background: #ffffff;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: opacity, transform;
        }

        .logo-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
        }

        .logo-circle {
            position: absolute;
            border-radius: 50%;
            border: 3px solid #e0e0e0;
            -webkit-animation: pulse 1.5s ease-in-out infinite;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .logo-circle.large {
            width: 140px;
            height: 140px;
            border-color: #e8e8e8;
            -webkit-animation-duration: 2s;
            animation-duration: 2s;
        }

        .logo-circle.medium {
            width: 110px;
            height: 110px;
            border-color: #d0d0d0;
            -webkit-animation-duration: 1.5s;
            animation-duration: 1.5s;
        }

        .logo-circle.small {
            width: 80px;
            height: 80px;
            border-color: #000000;
            -webkit-animation-duration: 1s;
            animation-duration: 1s;
        }

        .logo-inner {
            width: 50px;
            height: 50px;
            background: #000000;
            border-radius: 50%;
            z-index: 1;
            -webkit-animation: scaleIn 0.8s ease-out forwards;
            animation: scaleIn 0.8s ease-out forwards;
        }

        @-webkit-keyframes pulse {
            0%, 100% {
                -webkit-transform: scale(1);
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                -webkit-transform: scale(1.1);
                transform: scale(1.1);
                opacity: 0.3;
            }
        }

        @keyframes pulse {
            0%, 100% {
                -webkit-transform: scale(1);
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                -webkit-transform: scale(1.1);
                transform: scale(1.1);
                opacity: 0.3;
            }
        }

        @-webkit-keyframes scaleIn {
            0% {
                -webkit-transform: scale(0);
                transform: scale(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                -webkit-transform: scale(1);
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            0% {
                -webkit-transform: scale(0);
                transform: scale(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                -webkit-transform: scale(1);
                transform: scale(1);
                opacity: 1;
            }
        }

        .fade-out {
            -webkit-animation: fadeOut 0.6s ease-out forwards;
            animation: fadeOut 0.6s ease-out forwards;
            -webkit-animation-delay: 2.5s;
            animation-delay: 2.5s;
        }

        @-webkit-keyframes fadeOut {
            0% {
                opacity: 1;
                -webkit-transform: scale(1);
                transform: scale(1);
            }
            100% {
                opacity: 0;
                -webkit-transform: scale(0.8);
                transform: scale(0.8);
            }
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
                -webkit-transform: scale(1);
                transform: scale(1);
            }
            100% {
                opacity: 0;
                -webkit-transform: scale(0.8);
                transform: scale(0.8);
            }
        }

        @media (max-width: 480px) {
            .logo-wrapper {
                width: 150px;
                height: 150px;
            }
            
            .logo-circle.large {
                width: 135px;
                height: 135px;
            }
            
            .logo-circle.medium {
                width: 105px;
                height: 105px;
            }
            
            .logo-circle.small {
                width: 75px;
                height: 75px;
            }
            
            .logo-inner {
                width: 45px;
                height: 45px;
            }
        }
    </style>
    <script src="Chat/chat-notification.js"></script>
</head>
<body>
    <div class="splash-container" id="splash">
        <div class="logo-wrapper">
            <div class="logo-circle large"></div>
            <div class="logo-circle medium"></div>
            <div class="logo-circle small"></div>
            <div class="logo-inner"></div>
        </div>
    </div>

    <script>
        (function() {
            window.location.href = 'index.html';
        })();
    </script>
</body>
</html>
