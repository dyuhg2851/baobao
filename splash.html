<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>开屏动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
        }

        body {
            background: radial-gradient(circle at center, #f8fbff 0%, #f2f4f8 45%, #ffffff 100%);
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            z-index: 9999;
            background: transparent;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: opacity, transform;
            flex-direction: column;
            gap: 18px;
        }

        .logo-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
        }

        .logo-circle {
            position: absolute;
            border-radius: 50%;
            border: 3px solid #e0e0e0;
            -webkit-animation: pulse 1.5s ease-in-out infinite;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .logo-circle.large {
            width: 140px;
            height: 140px;
            border-color: #e8e8e8;
            -webkit-animation-duration: 2s;
            animation-duration: 2s;
        }

        .logo-circle.medium {
            width: 110px;
            height: 110px;
            border-color: #d0d0d0;
            -webkit-animation-duration: 1.5s;
            animation-duration: 1.5s;
        }

        .logo-circle.small {
            width: 80px;
            height: 80px;
            border-color: #000000;
            -webkit-animation-duration: 1s;
            animation-duration: 1s;
        }

        .logo-inner {
            width: 50px;
            height: 50px;
            background: #000000;
            border-radius: 50%;
            z-index: 1;
            -webkit-animation: scaleIn 0.8s ease-out forwards;
            animation: scaleIn 0.8s ease-out forwards;
        }

        .logo-text {
            font-size: 16px;
            color: #333333;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0;
            animation: slideIn 0.9s ease-out 0.6s forwards;
        }

        @-webkit-keyframes slideIn {
            0% {
                opacity: 0;
                -webkit-transform: translateY(10px);
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                -webkit-transform: translateY(0);
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            0% {
                opacity: 0;
                -webkit-transform: translateY(10px);
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                -webkit-transform: translateY(0);
                transform: translateY(0);
            }
        }

        @-webkit-keyframes pulse {
            0%, 100% {
                -webkit-transform: scale(1);
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                -webkit-transform: scale(1.1);
                transform: scale(1.1);
                opacity: 0.3;
            }
        }

        @keyframes pulse {
            0%, 100% {
                -webkit-transform: scale(1);
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                -webkit-transform: scale(1.1);
                transform: scale(1.1);
                opacity: 0.3;
            }
        }

        @-webkit-keyframes scaleIn {
            0% {
                -webkit-transform: scale(0);
                transform: scale(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                -webkit-transform: scale(1);
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            0% {
                -webkit-transform: scale(0);
                transform: scale(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                -webkit-transform: scale(1);
                transform: scale(1);
                opacity: 1;
            }
        }

        .fade-out {
            -webkit-animation: fadeOut 0.6s ease-out forwards;
            animation: fadeOut 0.6s ease-out forwards;
            -webkit-animation-delay: 2.5s;
            animation-delay: 2.5s;
        }

        @-webkit-keyframes fadeOut {
            0% {
                opacity: 1;
                -webkit-transform: translateY(0) scale(1);
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                -webkit-transform: translateY(-20px) scale(0.95);
                transform: translateY(-20px) scale(0.95);
            }
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
                -webkit-transform: translateY(0) scale(1);
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                -webkit-transform: translateY(-20px) scale(0.95);
                transform: translateY(-20px) scale(0.95);
            }
        }

        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
        }

        @keyframes spin {
            0% { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
        }

        .logo-circle.large {
            animation-name: pulse, spin;
            animation-duration: 2s, 24s;
            animation-timing-function: ease-in-out, linear;
            animation-iteration-count: infinite, infinite;
        }

        .logo-circle.medium {
            animation-name: pulse, spin;
            animation-duration: 1.5s, 18s;
            animation-timing-function: ease-in-out, linear;
            animation-iteration-count: infinite, infinite;
            animation-direction: reverse;
        }

        .logo-circle.small {
            animation-name: pulse, spin;
            animation-duration: 1s, 14s;
            animation-timing-function: ease-in-out, linear;
            animation-iteration-count: infinite, infinite;
        }

        @media (max-width: 480px) {
            .logo-wrapper {
                width: 150px;
                height: 150px;
            }
            
            .logo-circle.large {
                width: 135px;
                height: 135px;
            }
            
            .logo-circle.medium {
                width: 105px;
                height: 105px;
            }
            
            .logo-circle.small {
                width: 75px;
                height: 75px;
            }
            
            .logo-inner {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container" id="splash">
        <div class="logo-wrapper">
            <div class="logo-circle large"></div>
            <div class="logo-circle medium"></div>
            <div class="logo-circle small"></div>
            <div class="logo-inner"></div>
        </div>
        <div class="logo-text">晕倒料理</div>
    </div>

    <script>
        (function() {
            var splash = document.getElementById('splash');
            window.addEventListener('load', function() {
                setTimeout(function() {
                    splash.classList.add('fade-out');
                }, 1600);
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 2200);
            });
        })();
    </script>
</body>
</html>
