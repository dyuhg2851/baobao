<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="emoji-pack.css">
    <title>Emoji Pack</title>
</head>
<body>
    <div class="settings-container">
        <div class="header">
            <button id="back-btn" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"/></svg>
            </button>
            <h1>Emoji Pack</h1>
            <button id="add-btn" class="add-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z"/></svg>
            </button>
        </div>

        <div class="emoji-grid" id="emoji-grid"></div>
    </div>

    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h2>添加表情</h2>
            <textarea id="emoji-input" placeholder="可一次性输入多个图片URL，支持空格/逗号分隔，格式：名字：URL 或直接URL"></textarea>
            <div class="modal-buttons">
                <button id="cancel-btn" class="btn btn-cancel">Cancel</button>
                <button id="confirm-btn" class="btn btn-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <div class="delete-btn" id="delete-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#ff3b30" d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12z"/></svg>
    </div>

    <script src="emoji-pack.js"></script>
</body>
</html>
