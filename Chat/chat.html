<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="chat.css">
    <script src="chat-notification.js" defer></script>
    <title>WeChat</title>
</head>
<body>
    <div class="settings-container">
        <div class="header">
            <button id="back-btn" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"/></svg>
            </button>
            <h1>Message</h1>
            <div class="decoration">＞𐋣＜</div>
        </div>
        
        <div class="page-content">
            <div class="search-box">
                <div id="search-text" class="search-text" contenteditable="true">Search</div>
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M19 11.5a7.5 7.5 0 1 1-15 0a7.5 7.5 0 0 1 15 0m-2.107 5.42l3.08 3.08"/><path d="M11.5 13.5a2 2 0 1 0 0-4a2 2 0 0 0 0 4"/></g></svg>
            </div>
            
            <div class="calendar">
                <div class="calendar-header">
                    <button class="calendar-prev" id="calendar-prev">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span class="calendar-month" id="calendar-month"></span>
                    <button class="calendar-next" id="calendar-next">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
                <div class="calendar-dates" id="calendar-dates"></div>
            </div>
            
            <!-- 纪念日模块 -->
            <div class="anniversary-container">
                <div class="anniversary-card">
                    <!-- 粉色光斑效果 -->
                    <div class="sparkle-1"></div>
                    <div class="sparkle-2"></div>
                    <div class="sparkle-3"></div>
                    
                    <div class="avatar-heart avatar-char">
                        <div class="heart-avatar-inner" id="anniversary-char-avatar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#ffffff" d="M23 9A7 7 0 1 1 9 9a7 7 0 0 1 14 0m-2 0a5 5 0 1 0-10 0a5 5 0 0 0 10 0M7.5 18A3.5 3.5 0 0 0 4 21.5v.5c0 2.393 1.523 4.417 3.685 5.793C9.859 29.177 12.802 30 16 30s6.14-.823 8.315-2.207C26.477 26.417 28 24.393 28 22v-.5a3.5 3.5 0 0 0-3.5-3.5zM6 21.5A1.5 1.5 0 0 1 7.5 20h17a1.5 1.5 0 0 1 1.5 1.5v.5c0 1.473-.94 2.949-2.759 4.106C21.434 27.256 18.877 28 16 28s-5.434-.744-7.241-1.894C6.939 24.95 6 23.472 6 22z"/></svg>
                        </div>
                    </div>
                    <div class="anniversary-content" id="anniversary-content">
                        <div class="anniversary-label">幸福</div>
                        <div class="anniversary-dashed-line"></div>
                        <div class="anniversary-days" id="anniversary-days">--</div>
                    </div>
                    <div class="avatar-heart avatar-user">
                        <div class="heart-avatar-inner" id="anniversary-user-avatar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#ffffff" d="M23 9A7 7 0 1 1 9 9a7 7 0 0 1 14 0m-2 0a5 5 0 1 0-10 0a5 5 0 0 0 10 0M7.5 18A3.5 3.5 0 0 0 4 21.5v.5c0 2.393 1.523 4.417 3.685 5.793C9.859 29.177 12.802 30 16 30s6.14-.823 8.315-2.207C26.477 26.417 28 24.393 28 22v-.5a3.5 3.5 0 0 0-3.5-3.5zM6 21.5A1.5 1.5 0 0 1 7.5 20h17a1.5 1.5 0 0 1 1.5 1.5v.5c0 1.473-.94 2.949-2.759 4.106C21.434 27.256 18.877 28 16 28s-5.434-.744-7.241-1.894C6.939 24.95 6 23.472 6 22z"/></svg>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="character-list">
                <div class="character-card">
                    <div class="card-content">
                        <div class="avatar">
                            <div class="avatar-placeholder">
                                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#ffffff" d="M23 9A7 7 0 1 1 9 9a7 7 0 0 1 14 0m-2 0a5 5 0 1 0-10 0a5 5 0 0 0 10 0M7.5 18A3.5 3.5 0 0 0 4 21.5v.5c0 2.393 1.523 4.417 3.685 5.793C9.859 29.177 12.802 30 16 30s6.14-.823 8.315-2.207C26.477 26.417 28 24.393 28 22v-.5a3.5 3.5 0 0 0-3.5-3.5zM6 21.5A1.5 1.5 0 0 1 7.5 20h17a1.5 1.5 0 0 1 1.5 1.5v.5c0 1.473-.94 2.949-2.759 4.106C21.434 27.256 18.877 28 16 28s-5.434-.744-7.241-1.894C6.939 24.95 6 23.472 6 22z"/></svg>
                            </div>
                        </div>
                        <div class="character-info">
                            <div class="character-name">Char</div>
                            <div class="last-message">Hey! How are you doing today?</div>
                            <div class="message-time">05/20 13:14</div>
                        </div>
                        <button class="chat-btn" id="chat-btn">Chat</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="dock">
            <button class="nav-item active message">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092a10 10 0 1 0-4.777-4.719"/></svg>
            </button>
            <button class="nav-item profile">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5" d="M18 10h-5m9 1.798c0-2.632 0-3.949-.77-4.804a3 3 0 0 0-.224-.225C20.151 6 18.834 6 16.202 6h-.374c-1.153 0-1.73 0-2.268-.153a4 4 0 0 1-.848-.352C12.224 5.224 11.816 4.815 11 4l-.55-.55c-.274-.274-.41-.41-.554-.53a4 4 0 0 0-2.18-.903C7.53 2 7.336 2 6.95 2c-.883 0-1.324 0-1.692.07A4 4 0 0 0 2.07 5.257C2 5.626 2 6.068 2 6.95M21.991 16c-.036 2.48-.22 3.885-1.163 4.828C19.657 22 17.771 22 14 22h-4c-3.771 0-5.657 0-6.828-1.172S2 17.771 2 14v-3"/></svg>
            </button>
            <button class="nav-item moments">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M2.5 8a5.5 5.5 0 0 1 8.14-4.827a.75.75 0 1 0 .72-1.315a7 7 0 0 0-9.502 9.502a.75.75 0 0 0 1.315-.72A5.5 5.5 0 0 1 2.5 8m11.642-3.36a.75.75 0 1 0-1.315.72a5.5 5.5 0 0 1-7.466 7.466a.75.75 0 1 0-.722 1.316a7 7 0 0 0 9.502-9.502M9.5 8a1.5 1.5 0 1 1-3 0a1.5 1.5 0 0 1 3 0M11 8a3 3 0 1 1-6 0a3 3 0 0 1 6 0"/></svg>
            </button>
            <button class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M23 9A7 7 0 1 1 9 9a7 7 0 0 1 14 0m-2 0a5 5 0 1 0-10 0a5 5 0 0 0 10 0M7.5 18A3.5 3.5 0 0 0 4 21.5v.5c0 2.393 1.523 4.417 3.685 5.793C9.859 29.177 12.802 30 16 30s6.14-.823 8.315-2.207C26.477 26.417 28 24.393 28 22v-.5a3.5 3.5 0 0 0-3.5-3.5zM6 21.5A1.5 1.5 0 0 1 7.5 20h17a1.5 1.5 0 0 1 1.5 1.5v.5c0 1.473-.94 2.949-2.759 4.106C21.434 27.256 18.877 28 16 28s-5.434-.744-7.241-1.894C6.939 24.95 6 23.472 6 22z"/></svg>
            </button>
        </div>
    </div>
    
    <script>
        // 北京时间格式化函数 (UTC+8) - 使用Intl确保准确的时区转换
        function formatBeijingTime(date) {
            if (!(date instanceof Date)) {
                date = new Date(date);
            }
            
            const formatter = new Intl.DateTimeFormat('zh-CN', {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            
            const parts = formatter.formatToParts(date);
            let result = {
                year: '',
                month: '',
                day: '',
                hours: '',
                minutes: '',
                date: new Date(date.toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }))
            };
            
            parts.forEach(part => {
                switch(part.type) {
                    case 'year': result.year = part.value; break;
                    case 'month': result.month = part.value; break;
                    case 'day': result.day = part.value; break;
                    case 'hour': result.hours = part.value; break;
                    case 'minute': result.minutes = part.value; break;
                }
            });
            
            return result;
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    window.location.replace('../index.html');
                });
            }
            
            const navItems = document.querySelectorAll('.nav-item');
            const navLinks = ['chat.html', 'profile.html', 'moments.html', 'me.html'];
            navItems.forEach((item, index) => {
                item.addEventListener('click', function() {
                    navItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    window.location.replace(navLinks[index]);
                });
            });
            
            // 搜索文本永久保存
            const searchText = document.getElementById('search-text');
            if (searchText) {
                // 加载保存的搜索文本
                const savedSearch = localStorage.getItem('chat_search_text');
                if (savedSearch) {
                    searchText.textContent = savedSearch;
                }
                
                // 监听输入变化并保存
                searchText.addEventListener('input', function() {
                    localStorage.setItem('chat_search_text', this.textContent);
                });
                
                // 监听失焦事件确保保存
                searchText.addEventListener('blur', function() {
                    localStorage.setItem('chat_search_text', this.textContent);
                });
            }
            
            // 加载Char资料
            const loadCharProfile = () => {
                const savedData = localStorage.getItem('profile_char');
                if (savedData) {
                    const data = JSON.parse(savedData);
                    const avatarPlaceholder = document.querySelector('.character-card .avatar-placeholder');
                    const nameElement = document.querySelector('.character-card .character-name');
                    const signatureElement = document.querySelector('.character-card .last-message');
                    
                    if (data.name && nameElement) {
                        nameElement.textContent = data.name;
                    }
                    if (data.signature && signatureElement) {
                        signatureElement.textContent = data.signature;
                    }
                    if (data.avatar && avatarPlaceholder) {
                        avatarPlaceholder.style.backgroundImage = `url(${data.avatar})`;
                        avatarPlaceholder.innerHTML = '';
                    }
                }
            };
            
            // 加载最后一条聊天消息
            const loadLastMessage = () => {
                const saved = localStorage.getItem('chat_messages');
                if (saved) {
                    try {
                        const messages = JSON.parse(saved);
                        if (messages.length > 0) {
                            const last = messages[messages.length - 1];
                            const msgEl = document.querySelector('.character-card .last-message');
                            const timeEl = document.querySelector('.character-card .message-time');
                            if (msgEl) msgEl.textContent = (last.role === 'sent' ? 'Me: ' : 'Ta: ') + last.text;
                            if (timeEl) {
                                const d = new Date(last.time);
                                const bt = formatBeijingTime(d);
                                timeEl.textContent = bt.month + '/' + bt.day + ' ' + bt.hours + ':' + bt.minutes;
                            }
                        }
                    } catch(e) {}
                }
            };
            
            // 使用requestAnimationFrame优化渲染
            requestAnimationFrame(() => {
                loadCharProfile();
                loadLastMessage();
            });
            
            // 日历功能延迟加载
            requestAnimationFrame(() => {
                initCalendar();
            });
            
            // 纪念日功能延迟加载
            requestAnimationFrame(() => {
                initAnniversary();
            });
            
            // Chat按钮点击事件
            const chatBtn = document.getElementById('chat-btn');
            if (chatBtn) {
                chatBtn.addEventListener('click', function() {
                    window.location.replace('chat-room.html');
                });
            }
        });
        
        function initCalendar() {
            const today = new Date();
            const timezoneOffset = 8 * 60; // 北京时区 UTC+8
            const utc = today.getTime() + today.getTimezoneOffset() * 60000;
            const beijingDate = new Date(utc + timezoneOffset * 60000);
            
            renderCalendar(beijingDate);
            
            document.getElementById('calendar-prev').addEventListener('click', function() {
                const currentMonth = document.getElementById('calendar-month').dataset.date;
                const date = new Date(currentMonth);
                date.setDate(date.getDate() - 7);
                renderCalendar(date);
            });
            
            document.getElementById('calendar-next').addEventListener('click', function() {
                const currentMonth = document.getElementById('calendar-month').dataset.date;
                const date = new Date(currentMonth);
                date.setDate(date.getDate() + 7);
                renderCalendar(date);
            });
        }
        
        function renderCalendar(centerDate) {
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const weekdayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            const timezoneOffset = 8 * 60;
            const utc = centerDate.getTime() + centerDate.getTimezoneOffset() * 60000;
            const beijingCenterDate = new Date(utc + timezoneOffset * 60000);
            
            // 获取今日日期（北京时区）
            const today = new Date();
            const todayUtc = today.getTime() + today.getTimezoneOffset() * 60000;
            const beijingToday = new Date(todayUtc + timezoneOffset * 60000);
            
            // 获取中间日期所在月份
            const calendarMonth = document.getElementById('calendar-month');
            calendarMonth.textContent = monthNames[beijingCenterDate.getMonth()] + ' ' + beijingCenterDate.getFullYear();
            calendarMonth.dataset.date = beijingCenterDate.toISOString().split('T')[0];
            
            // 生成前后各3天的日期（共7天）
            const datesContainer = document.getElementById('calendar-dates');
            datesContainer.innerHTML = '';
            
            for (let i = -3; i <= 3; i++) {
                const date = new Date(beijingCenterDate);
                date.setDate(date.getDate() + i);
                
                const dateElement = document.createElement('div');
                dateElement.className = 'calendar-date';
                
                // 判断是否是今天
                const isToday = date.toDateString() === beijingToday.toDateString();
                if (isToday) {
                    dateElement.classList.add('today');
                }
                
                // 未到日期使用大圆角背景
                if (date > beijingToday) {
                    dateElement.classList.add('upcoming');
                }
                
                // 判断是否是其他月份的日期（显示淡色）
                if (date.getMonth() !== beijingCenterDate.getMonth()) {
                    dateElement.classList.add('fade');
                }
                
                const dayElement = document.createElement('div');
                dayElement.className = 'date-day';
                dayElement.textContent = date.getDate();
                
                const weekdayElement = document.createElement('div');
                weekdayElement.className = 'date-weekday';
                weekdayElement.textContent = weekdayNames[date.getDay()];
                
                dateElement.appendChild(dayElement);
                dateElement.appendChild(weekdayElement);
                datesContainer.appendChild(dateElement);
            }
        }
        
        // 纪念日功能
        function initAnniversary() {
            // 初始化日期选择器选项
            initDatePickers();
            
            // 加载头像
            loadAnniversaryAvatars();
            
            // 加载并显示纪念日天数
            updateAnniversaryDays();
            
            // 绑定点击事件
            bindAnniversaryEvents();
        }
        
        function initDatePickers() {
            const yearSelect = document.getElementById('anniversary-year');
            const monthSelect = document.getElementById('anniversary-month');
            const daySelect = document.getElementById('anniversary-day');
            
            // 添加年份选项（最近50年到当前年）
            const currentYear = new Date().getFullYear();
            for (let i = currentYear; i >= currentYear - 50; i--) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                yearSelect.appendChild(option);
            }
            
            // 添加月份选项
            for (let i = 1; i <= 12; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                monthSelect.appendChild(option);
            }
            
            // 添加日期选项
            updateDays(12); // 默认12月有31天
            
            // 监听月份变化更新日期选项
            monthSelect.addEventListener('change', function() {
                const year = parseInt(yearSelect.value);
                const month = parseInt(monthSelect.value);
                updateDays(month, year);
            });
            
            yearSelect.addEventListener('change', function() {
                const year = parseInt(yearSelect.value);
                const month = parseInt(monthSelect.value);
                updateDays(month, year);
            });
        }
        
        function updateDays(month, year = new Date().getFullYear()) {
            const daySelect = document.getElementById('anniversary-day');
            // 清空现有选项
            daySelect.innerHTML = '';
            
            // 获取该月的天数
            const daysInMonth = new Date(year, month, 0).getDate();
            
            for (let i = 1; i <= daysInMonth; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                daySelect.appendChild(option);
            }
        }
        
        function loadAnniversaryAvatars() {
            // 加载Char头像
            const savedData = localStorage.getItem('profile_char');
            if (savedData) {
                const data = JSON.parse(savedData);
                const charAvatar = document.getElementById('anniversary-char-avatar');
                if (data.avatar && charAvatar) {
                    charAvatar.style.backgroundImage = `url(${data.avatar})`;
                    charAvatar.innerHTML = '';
                }
            }
            
            // 加载用户头像（可以从localStorage获取或使用默认）
            const userAvatar = document.getElementById('anniversary-user-avatar');
            const userData = localStorage.getItem('profile_user');
            if (userData) {
                const data = JSON.parse(userData);
                if (data.avatar && userAvatar) {
                    userAvatar.style.backgroundImage = `url(${data.avatar})`;
                    userAvatar.innerHTML = '';
                }
            }
        }
        
        function updateAnniversaryDays() {
            const savedDate = localStorage.getItem('anniversary_date');
            const daysElement = document.getElementById('anniversary-days');
            
            if (savedDate) {
                const anniversaryDate = new Date(savedDate);
                const today = new Date();
                
                // 确保使用相同的时区
                const timezoneOffset = 8 * 60; // 北京时区 UTC+8
                const utc = today.getTime() + today.getTimezoneOffset() * 60000;
                const beijingToday = new Date(utc + timezoneOffset * 60000);
                
                // 设置纪念日为同一天的零时
                anniversaryDate.setHours(0, 0, 0, 0);
                beijingToday.setHours(0, 0, 0, 0);
                
                // 计算天数差（包含第一天）
                const diffTime = beijingToday.getTime() - anniversaryDate.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
                
                if (diffDays >= 1) {
                    daysElement.textContent = diffDays;
                } else {
                    daysElement.textContent = '--';
                }
            } else {
                daysElement.textContent = '--';
            }
        }
        
        function bindAnniversaryEvents() {
            const daysElement = document.getElementById('anniversary-days');
            const modal = document.getElementById('anniversary-modal');
            const cancelBtn = document.getElementById('modal-cancel');
            const confirmBtn = document.getElementById('modal-confirm');
            const yearSelect = document.getElementById('anniversary-year');
            const monthSelect = document.getElementById('anniversary-month');
            const daySelect = document.getElementById('anniversary-day');
            
            // 点击天数打开弹窗
            daysElement.addEventListener('click', function() {
                // 加载已保存的日期
                const savedDate = localStorage.getItem('anniversary_date');
                if (savedDate) {
                    const date = new Date(savedDate);
                    yearSelect.value = date.getFullYear();
                    monthSelect.value = date.getMonth() + 1;
                    daySelect.value = date.getDate();
                    
                    // 更新日期选项
                    updateDays(date.getMonth() + 1, date.getFullYear());
                } else {
                    // 默认选中今天
                    const today = new Date();
                    yearSelect.value = today.getFullYear();
                    monthSelect.value = today.getMonth() + 1;
                    daySelect.value = today.getDate();
                    updateDays(today.getMonth() + 1, today.getFullYear());
                }
                
                modal.classList.add('show');
            });
            
            // 取消按钮
            cancelBtn.addEventListener('click', function() {
                modal.classList.remove('show');
            });
            
            // 确定按钮
            confirmBtn.addEventListener('click', function() {
                const year = parseInt(yearSelect.value);
                const month = parseInt(monthSelect.value) - 1; // 月份从0开始
                const day = parseInt(daySelect.value);
                
                const anniversaryDate = new Date(year, month, day);
                localStorage.setItem('anniversary_date', anniversaryDate.toISOString());
                
                // 更新显示
                updateAnniversaryDays();
                
                modal.classList.remove('show');
            });
            
            // 点击遮罩层关闭弹窗
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.classList.remove('show');
                }
            });
        }
    </script>
    
    <!-- 日期选择弹窗 -->
    <div class="anniversary-modal-overlay" id="anniversary-modal">
        <div class="anniversary-modal">
            <div class="modal-title">设置纪念日</div>
            <div class="date-picker-container">
                <div class="date-picker-item">
                    <div class="date-picker-label">年</div>
                    <select class="date-picker-select" id="anniversary-year">
                    </select>
                </div>
                <div class="date-picker-item">
                    <div class="date-picker-label">月</div>
                    <select class="date-picker-select" id="anniversary-month">
