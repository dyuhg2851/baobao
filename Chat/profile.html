<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="profile.css">
    <title>Profile</title>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <button id="back-btn" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"/></svg>
            </button>
            <h1>Archive</h1>
            <div class="decoration">＞𐋣＜</div>
        </div>
        
        <div class="page-content">
            <div class="archive-list">
                <!-- User档案 -->
                <div class="archive-card">
                    <div class="archive-label">User</div>
                    <div class="card-content">
                        <div class="avatar-section">
                            <div class="avatar-placeholder">
                                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#ffffff" d="M23 9A7 7 0 1 1 9 9a7 7 0 0 1 14 0m-2 0a5 5 0 1 0-10 0a5 5 0 0 0 10 0M7.5 18A3.5 3.5 0 0 0 4 21.5v.5c0 2.393 1.523 4.417 3.685 5.793C9.859 29.177 12.802 30 16 30s6.14-.823 8.315-2.207C26.477 26.417 28 24.393 28 22v-.5a3.5 3.5 0 0 0-3.5-3.5zM6 21.5A1.5 1.5 0 0 1 7.5 20h17a1.5 1.5 0 0 1 1.5 1.5v.5c0 1.473-.94 2.949-2.759 4.106C21.434 27.256 18.877 28 16 28s-5.434-.744-7.241-1.894C6.939 24.95 6 23.472 6 22z"/></svg>
                            </div>
                        </div>
                        <div class="divider-line"></div>
                        <div class="info-section">
                            <h2 class="character-name">User</h2>
                            <p class="signature">这是User的个性签名占位</p>
                            <button class="edit-btn" data-type="user">EDIT</button>
                        </div>
                    </div>
                </div>
                
                <!-- Char档案 -->
                <div class="archive-card">
                    <div class="archive-label">Char</div>
                    <div class="card-content">
                        <div class="avatar-section">
                            <div class="avatar-placeholder">
                                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#ffffff" d="M23 9A7 7 0 1 1 9 9a7 7 0 0 1 14 0m-2 0a5 5 0 1 0-10 0a5 5 0 0 0 10 0M7.5 18A3.5 3.5 0 0 0 4 21.5v.5c0 2.393 1.523 4.417 3.685 5.793C9.859 29.177 12.802 30 16 30s6.14-.823 8.315-2.207C26.477 26.417 28 24.393 28 22v-.5a3.5 3.5 0 0 0-3.5-3.5zM6 21.5A1.5 1.5 0 0 1 7.5 20h17a1.5 1.5 0 0 1 1.5 1.5v.5c0 1.473-.94 2.949-2.759 4.106C21.434 27.256 18.877 28 16 28s-5.434-.744-7.241-1.894C6.939 24.95 6 23.472 6 22z"/></svg>
                            </div>
                        </div>
                        <div class="divider-line"></div>
                        <div class="info-section">
                            <h2 class="character-name">Char</h2>
                            <p class="signature">这是Char的个性签名占位</p>
                            <button class="edit-btn" data-type="char">EDIT</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bottom-nav">
            <button class="nav-item message">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092a10 10 0 1 0-4.777-4.719"/></svg>
            </button>
            <button class="nav-item active profile">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="M10 16.5H6m2-3H6"/><path d="M14 15c0-.943 0-1.414.293-1.707S15.057 13 16 13s1.414 0 1.707.293S18 14.057 18 15s0 1.414-.293 1.707S16.943 17 16 17s-1.414 0-1.707-.293S14 15.943 14 15Z"/><path stroke-linecap="round" d="M22 12c0-3.771 0-5.657-1.172-6.828S17.771 4 14 4h-4C6.229 4 4.343 4 3.172 5.172S2 8.229 2 12s0 5.657 1.172 6.828S6.229 20 10 20h4c3.771 0 5.657 0 6.828-1.172c.654-.653.943-1.528 1.07-2.828M2 10h5m15 0H11"/></g></svg>
            </button>
            <button class="nav-item moments">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 14 14"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9.692 13.01a.98.98 0 0 0 .88-.917c.101-1.65.155-3.258.155-5.093s-.054-3.443-.156-5.093a.98.98 0 0 0-.88-.917a38 38 0 0 0-7.906 0a.98.98 0 0 0-.879.917C.804 3.557.75 5.165.75 7s.054 3.443.156 5.093c.03.48.4.869.88.917c2.748.275 5.157.275 7.906 0m1.035-11h1.467c.34 0 .67.169.81.48c.36.792.306 1.548-.043 2.714a.97.97 0 0 1-.935.682h-1.299z"/><path d="M10.727 5.886h1.467c.34 0 .67.169.81.48c.36.792.306 1.548-.043 2.714a.97.97 0 0 1-.935.682h-1.299zM4.301 3.441h2.874s.75 0 .75.75v1.01s0 .75-.75.75H4.301s-.75 0-.75-.75v-1.01s0-.75.75-.75"/></g></svg>
            </button>
            <button class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32"><path fill="currentColor" d="M23 9A7 7 0 1 1 9 9a7 7 0 0 1 14 0m-2 0a5 5 0 1 0-10 0a5 5 0 0 0 10 0M7.5 18A3.5 3.5 0 0 0 4 21.5v.5c0 2.393 1.523 4.417 3.685 5.793C9.859 29.177 12.802 30 16 30s6.14-.823 8.315-2.207C26.477 26.417 28 24.393 28 22v-.5a3.5 3.5 0 0 0-3.5-3.5zM6 21.5A1.5 1.5 0 0 1 7.5 20h17a1.5 1.5 0 0 1 1.5 1.5v.5c0 1.473-.94 2.949-2.759 4.106C21.434 27.256 18.877 28 16 28s-5.434-.744-7.241-1.894C6.939 24.95 6 23.472 6 22z"/></svg>
            </button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    window.location.replace('../index.html');
                });
            }
            
            const navItems = document.querySelectorAll('.nav-item');
            const navLinks = ['chat.html', 'profile.html', 'moments.html', 'me.html'];
            navItems.forEach((item, index) => {
                item.addEventListener('click', function() {
                    navItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    window.location.replace(navLinks[index]);
                });
            });
            
            // 加载保存的头像和名字
            const loadProfileData = () => {
                const cards = document.querySelectorAll('.archive-card');
                cards.forEach(card => {
                    const label = card.querySelector('.archive-label');
                    if (label) {
                        const type = label.textContent.toLowerCase();
                        const savedData = localStorage.getItem('profile_' + type);
                        if (savedData) {
                            const data = JSON.parse(savedData);
                            const avatarPlaceholder = card.querySelector('.avatar-placeholder');
                            const nameElement = card.querySelector('.character-name');
                            const signatureElement = card.querySelector('.signature');
                            
                            if (data.name && nameElement) {
                                nameElement.textContent = data.name;
                            }
                            if (data.signature && signatureElement) {
                                signatureElement.textContent = data.signature;
                            }
                            if (data.avatar && avatarPlaceholder) {
                                avatarPlaceholder.style.backgroundImage = `url(${data.avatar})`;
                                avatarPlaceholder.innerHTML = '';
                            }
                        }
                    }
                });
            };
            
            loadProfileData();
            
            // Edit按钮点击事件
            const editBtns = document.querySelectorAll('.edit-btn');
            editBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const type = this.getAttribute('data-type');
                    window.location.replace('edit-profile.html?type=' + type);
                });
            });
        });
    </script>
</body>
</html>
