<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="moments.css">
    <script src="moment-api.js"></script>
    <title>Moments</title>
</head>
<body>
    <div class="settings-container">
        <div class="header">
            <button id="back-btn" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"/></svg>
            </button>
            <h1>Moments</h1>
            <div class="decoration">＞𐋣＜</div>
        </div>
        
        <div class="page-content">
            <div class="moments-cover" id="moments-cover">
                <div class="cover-image" id="cover-image"></div>
                <div class="cover-overlay"></div>
            </div>
            
            <div class="user-info">
                <div class="avatar-wrapper" id="avatar-wrapper">
                    <div class="avatar" id="user-avatar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#999999" d="M23 9A7 7 0 1 1 9 9a7 7 0 0 1 14 0m-2 0a5 5 0 1 0-10 0a5 5 0 0 0 10 0M7.5 18A3.5 3.5 0 0 0 4 21.5v.5c0 2.393 1.523 4.417 3.685 5.793C9.859 29.177 12.802 30 16 30s6.14-.823 8.315-2.207C26.477 26.417 28 24.393 28 22v-.5a3.5 3.5 0 0 0-3.5-3.5zM6 21.5A1.5 1.5 0 0 1 7.5 20h17a1.5 1.5 0 0 1 1.5 1.5v.5c0 1.473-.94 2.949-2.759 4.106C21.434 27.256 18.877 28 16 28s-5.434-.744-7.241-1.894C6.939 24.95 6 23.472 6 22z"/></svg>
                    </div>
                </div>
                
                <div class="user-details">
                    <div class="name-row">
                        <a href="profile.html" class="user-name" id="user-name">User</a>
                        <button class="add-moment-btn" id="add-moment-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16"><path fill="#999999" d="M8 0q-.264 0-.523.017l.064.998a7 7 0 0 1 .918 0l.064-.998A8 8 0 0 0 8 0M6.44.152q-.52.104-1.012.27l.321.948q.43-.147.884-.237L6.44.153zm4.132.271a8 8 0 0 0-1.011-.27l-.194.98q.453.09.884.237zm1.873.925a8 8 0 0 0-.906-.524l-.443.896q.413.205.793.459zM4.46.824q-.471.233-.905.524l.556.83a7 7 0 0 1 .793-.458zM2.725 1.985q-.394.346-.74.74l.752.66q.303-.345.648-.648zm11.29.74a8 8 0 0 0-.74-.74l-.66.752q.346.303.648.648zm1.161 1.735a8 8 0 0 0-.524-.905l-.83.556q.254.38.458.793l.896-.443zM1.348 3.555q-.292.433-.524.906l.896.443q.205-.413.459-.793zM.423 5.428a8 8 0 0 0-.27 1.011l.98.194q.09-.453.237-.884zM15.848 6.44a8 8 0 0 0-.27-1.012l-.948.321q.147.43.237.884zM.017 7.477a8 8 0 0 0 0 1.046l.998-.064a7 7 0 0 1 0-.918zM16 8a8 8 0 0 0-.017-.523l-.998.064a7 7 0 0 1 0 .918l.998.064A8 8 0 0 0 16 8M.152 9.56q.104.52.27 1.012l.948-.321a7 7 0 0 1-.237-.884l-.98.194zm15.425 1.012q.168-.493.27-1.011l-.98-.194q-.09.453-.237.884zM.824 11.54a8 8 0 0 0 .524.905l.83-.556a7 7 0 0 1-.458-.793zm13.828.905q.292-.434.524-.906l-.896-.443q-.205.413-.459.793zm-12.667.83q.346.394.74.74l.66-.752a7 7 0 0 1-.648-.648zm11.29.74q.394-.346.74-.74l-.752-.66q-.302.346-.648.648zm-1.735 1.161q.471-.233.905-.524l-.556-.83a7 7 0 0 1-.793.458zm-7.985-.524q.434.292.906.524l.443-.896a7 7 0 0 1-.793-.459zm1.873.925q.493.168 1.011.27l.194-.98a7 7 0 0 1-.884-.237zm4.132.271a8 8 0 0 0 1.012-.27l-.321-.948a7 7 0 0 1-.884.237l.194.98zm-2.083.135a8 8 0 0 0 1.046 0l-.064-.998a7 7 0 0 1-.918 0zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"/></svg>
                        </button>
                    </div>
                    <div class="signature-wrapper">
                        <p class="signature" id="user-signature">This is user signature</p>
                    </div>
                </div>
            </div>
            
            <div class="photo-grid">
                <div class="photo-item" data-index="0">
                    <div class="photo-placeholder" id="photo-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"><path fill="#cccccc" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </div>
                </div>
                <div class="photo-item" data-index="1">
                    <div class="photo-placeholder" id="photo-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"><path fill="#cccccc" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </div>
                </div>
                <div class="photo-item" data-index="2">
                    <div class="photo-placeholder" id="photo-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"><path fill="#cccccc" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </div>
                </div>
            </div>
            
            <div class="moments-feed" id="moments-feed"></div>
        </div>
        
        <div class="dock">
            <button class="nav-item message">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092a10 10 0 1 0-4.777-4.719"/></svg>
            </button>
            <button class="nav-item profile">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5" d="M18 10h-5m9 1.798c0-2.632 0-3.949-.77-4.804a3 3 0 0 0-.224-.225C20.151 6 18.834 6 16.202 6h-.374c-1.153 0-1.73 0-2.268-.153a4 4 0 0 1-.848-.352C12.224 5.224 11.816 4.815 11 4l-.55-.55c-.274-.274-.41-.41-.554-.53a4 4 0 0 0-2.18-.903C7.53 2 7.336 2 6.95 2c-.883 0-1.324 0-1.692.07A4 4 0 0 0 2.07 5.257C2 5.626 2 6.068 2 6.95M21.991 16c-.036 2.48-.22 3.885-1.163 4.828C19.657 22 17.771 22 14 22h-4c-3.771 0-5.657 0-6.828-1.172S2 17.771 2 14v-3"/></svg>
            </button>
            <button class="nav-item active moments">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M2.5 8a5.5 5.5 0 0 1 8.14-4.827a.75.75 0 1 0 .72-1.315a7 7 0 0 0-9.502 9.502a.75.75 0 0 0 1.315-.72A5.5 5.5 0 0 1 2.5 8m11.642-3.36a.75.75 0 1 0-1.315.72a5.5 5.5 0 0 1-7.466 7.466a.75.75 0 1 0-.722 1.316a7 7 0 0 0 9.502-9.502M9.5 8a1.5 1.5 0 1 1-3 0a1.5 1.5 0 0 1 3 0M11 8a3 3 0 1 1-6 0a3 3 0 0 1 6 0" clip-rule="evenodd"/></svg>
            </button>
            <button class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32"><path fill="currentColor" d="M23 9A7 7 0 1 1 9 9a7 7 0 0 1 14 0m-2 0a5 5 0 1 0-10 0a5 5 0 0 0 10 0M7.5 18A3.5 3.5 0 0 0 4 21.5v.5c0 2.393 1.523 4.417 3.685 5.793C9.859 29.177 12.802 30 16 30s6.14-.823 8.315-2.207C26.477 26.417 28 24.393 28 22v-.5a3.5 3.5 0 0 0-3.5-3.5zM6 21.5A1.5 1.5 0 0 1 7.5 20h17a1.5 1.5 0 0 1 1.5 1.5v.5c0 1.473-.94 2.949-2.759 4.106C21.434 27.256 18.877 28 16 28s-5.434-.744-7.241-1.894C6.939 24.95 6 23.472 6 22z"/></svg>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="moment-modal">
        <div class="moment-card">
            <div class="moment-header">
                <span class="moment-title">Moment</span>
            </div>
            <textarea class="moment-content" id="moment-text" placeholder="What's on your mind?"></textarea>
            <div class="moment-attachment">
                <button class="attachment-btn" id="ai-post-btn">AI Post</button>
                <button class="attachment-btn" id="virtual-image-btn">Virtual Image</button>
                <button class="attachment-btn" id="real-image-btn">Real Image</button>
            </div>
            <div class="moment-image-preview" id="moment-image-preview" style="display: none;">
                <div class="image-preview-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><g fill="none" stroke="#999999" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M6.5 8a2 2 0 1 0 4 0a2 2 0 0 0-4 0m14.427 1.99c-6.61-.908-12.31 4-11.927 10.51"/><path d="M3 13.066c2.78-.385 5.275.958 6.624 3.1"/><path d="M3 9.4c0-2.24 0-3.36.436-4.216a4 4 0 0 1 1.748-1.748C6.04 3 7.16 3 9.4 3h5.2c2.24 0 3.36 0 4.216.436a4 4 0 0 1 1.748 1.748C21 6.04 21 7.16 21 9.4v5.2c0 2.24 0 3.36-.436 4.216a4 4 0 0 1-1.748 1.748C17.96 21 16.84 21 14.6 21H9.4c-2.24 0-3.36 0-4.216-.436a4 4 0 0 1-1.748-1.748C3 17.96 3 16.84 3 14.6z"/></g></svg>
                </div>
            </div>
            <div class="moment-loading" id="moment-loading" style="display: none;">
                <div class="loading-spinner"></div>
                <span>AI is thinking...</span>
            </div>
            <div class="moment-actions">
                <button class="action-btn cancel" id="moment-cancel">Cancel</button>
                <button class="action-btn send" id="moment-send">Send</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="virtual-image-modal">
        <div class="virtual-image-card">
            <div class="virtual-header">
                <span class="virtual-title">Virtual Image</span>
            </div>
            <textarea class="virtual-content" id="virtual-text" placeholder="Enter image description..."></textarea>
            <div class="virtual-actions">
                <button class="action-btn cancel" id="virtual-cancel">Cancel</button>
                <button class="action-btn send" id="virtual-send">Generate</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="delete-modal">
        <div class="delete-card">
            <div class="delete-message">Delete this moment?</div>
            <div class="delete-actions">
                <button class="action-btn cancel" id="delete-cancel">Cancel</button>
                <button class="action-btn send" id="delete-confirm">Delete</button>
            </div>
        </div>
    </div>

    <div class="comment-delete-modal" id="comment-delete-modal">
        <div class="delete-card">
            <div class="delete-message">Delete this comment?</div>
            <div class="delete-actions">
                <button class="action-btn cancel" id="comment-delete-cancel">Cancel</button>
                <button class="action-btn send" id="comment-delete-confirm">Delete</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="virtual-preview-modal">
        <div class="virtual-preview-card">
            <div class="virtual-preview-header">
                <span class="virtual-preview-title">Virtual Image Content</span>
                <button class="virtual-preview-close" id="virtual-preview-close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#999999" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="virtual-preview-content" id="virtual-preview-content"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化所有弹窗状态，确保页面加载时弹窗都是隐藏的
            window.currentDeleteIndex = null;
            window.currentDeleteMomentIndex = null;
            window.currentDeleteCommentIndex = null;
            
            document.getElementById('delete-modal').style.display = 'none';
            document.getElementById('comment-delete-modal').style.display = 'none';
            
            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    window.location.replace('../index.html');
                });
            }
            
            const navItems = document.querySelectorAll('.nav-item');
            const navLinks = ['chat.html', 'profile.html', 'moments.html', 'me.html'];
            navItems.forEach((item, index) => {
                item.addEventListener('click', function() {
                    navItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    window.location.replace(navLinks[index]);
                });
            });

            // 加载用户数据
            loadUserData();

            // 封面点击事件
            const coverSection = document.getElementById('moments-cover');
            coverSection.addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const coverImage = document.getElementById('cover-image');
                        coverImage.style.backgroundImage = `url(${e.target.result})`;
                        localStorage.setItem('moments_cover', e.target.result);
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            });

            // 头像点击 - 跳转到profile
            const avatarWrapper = document.getElementById('avatar-wrapper');
            avatarWrapper.addEventListener('click', function() {
                window.location.replace('profile.html');
            });

            // 名字点击 - 跳转到profile
            const userName = document.getElementById('user-name');
            userName.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.replace('profile.html');
            });

            // 签名点击也可以编辑
            const signatureElement = document.getElementById('user-signature');
            signatureElement.addEventListener('click', function() {
                const currentSignature = this.textContent;
                const newSignature = prompt('Edit your signature:', currentSignature);
                if (newSignature !== null) {
                    this.textContent = newSignature || 'This is user signature';
                    const userData = JSON.parse(localStorage.getItem('profile_user') || '{}');
                    userData.signature = newSignature || 'This is user signature';
                    localStorage.setItem('profile_user', JSON.stringify(userData));
                }
            });

            // 图片点击上传
            const photoItems = document.querySelectorAll('.photo-item');
            photoItems.forEach((item, index) => {
                item.addEventListener('click', function() {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.onchange = function(e) {
                        const file = e.target.files[0];
                        if (!file) return;
                        
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const photoPlaceholder = document.getElementById('photo-' + index);
                            photoPlaceholder.style.backgroundImage = `url(${e.target.result})`;
                            photoPlaceholder.innerHTML = '';
                            localStorage.setItem('moments_photo_' + index, e.target.result);
                        };
                        reader.readAsDataURL(file);
                    };
                    input.click();
                });
            });

            // Moment弹窗
            const momentModal = document.getElementById('moment-modal');
            const addMomentBtn = document.getElementById('add-moment-btn');
            const momentCancel = document.getElementById('moment-cancel');
            const momentSend = document.getElementById('moment-send');
            const virtualImageBtn = document.getElementById('virtual-image-btn');
            const realImageBtn = document.getElementById('real-image-btn');
            const virtualImageModal = document.getElementById('virtual-image-modal');
            const virtualCancel = document.getElementById('virtual-cancel');
            const virtualSend = document.getElementById('virtual-send');

            let currentMomentImage = null;

            addMomentBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                momentModal.style.display = 'flex';
            });

            momentCancel.addEventListener('click', function() {
                momentModal.style.display = 'none';
                document.getElementById('moment-text').value = '';
                document.getElementById('moment-image-preview').style.display = 'none';
                currentMomentImage = null;
            });

            momentSend.addEventListener('click', function() {
                const content = document.getElementById('moment-text').value;
                if (content || currentMomentImage) {
                    const userData = JSON.parse(localStorage.getItem('profile_user') || '{}');
                    const charData = JSON.parse(localStorage.getItem('profile_char') || '{}');
                    
                    const sender = {
                        user: userData.name || 'User',
                        char: localStorage.getItem('char_nickname') || charData.name || 'Char'
                    };
                    
                    const moments = JSON.parse(localStorage.getItem('moments_list') || '[]');
                    const newMoment = {
                        content: content,
                        image: currentMomentImage,
                        timestamp: Date.now(),
                        sender: sender,
                        from: 'user',
                        likedByChar: true,
                        comments: []
                    };
                    moments.unshift(newMoment);
                    localStorage.setItem('moments_list', JSON.stringify(moments));
                    
                    // Char自动点赞和评论
                    setTimeout(() => {
                        autoCharInteract(0, 'user');
                    }, 1500);
                    
                    renderMomentsFeed();
                }
                momentModal.style.display = 'none';
                document.getElementById('moment-text').value = '';
                document.getElementById('moment-image-preview').style.display = 'none';
                currentMomentImage = null;
            });
            
            // Char自动互动函数
            async function autoCharInteract(momentIndex, triggerType) {
                const moments = JSON.parse(localStorage.getItem('moments_list') || '[]');
                if (momentIndex >= moments.length) return;
                
                const moment = moments[momentIndex];
                
                // 如果是user发布的动态，char自动点赞和评论
                if (triggerType === 'user' && moment.from === 'user') {
                    // 自动点赞
                    moment.likedByChar = true;
                    
                    // 生成评论内容
                    const commentContent = await generateCharComment(moment);
                    if (commentContent) {
                        if (!moment.comments) moment.comments = [];
                        // 获取char名称（与chatroom保持一致，读取档案人设）
                        const charData = JSON.parse(localStorage.getItem('profile_char') || '{}');
                        const charName = localStorage.getItem('char_nickname') || charData.name || 'Char';
                        moment.comments.push({
                            name: charName,
                            content: commentContent,
                            timestamp: Date.now()
                        });
                    }
                    
                    localStorage.setItem('moments_list', JSON.stringify(moments));
                    renderMomentsFeed();
                }
            }
            
            // 生成char评论内容
            async function generateCharComment(moment) {
                // 读取人设数据（从档案模块）
                const charData = JSON.parse(localStorage.getItem('profile_char') || '{}');
                const userData = JSON.parse(localStorage.getItem('profile_user') || '{}');
                const charName = localStorage.getItem('char_nickname') || charData.name || 'Char';
                
                // 获取聊天提示词（与chatroom使用同一个）
                const chatPrompt = localStorage.getItem('chat_system_prompt') || '';
                
                // 获取聊天记录（最近50条）
                const chatMessages = JSON.parse(localStorage.getItem('chat_messages') || '[]');
                const recentChats = chatMessages.slice(-50).map(m => 
                    `${m.role === 'sent' ? userData.name || 'User' : charName}: ${m.content}`
                ).join('\n');
                
                // 获取记忆信息
                const memoryData = JSON.parse(localStorage.getItem('memory_data') || '{}');
                const memorySummary = memoryData.summary || '';
                
                const prompt = `你是${charName}，根据以下所有信息生成一条自然的评论回复：

=== 角色设定 ===
- 性格：${charData.personality || charData.settings || '友好'}
- 描述：${charData.bio || '暂无'}
- 生活习惯：${charData.lifestyle || '暂无'}

=== 聊天提示词 ===
${chatPrompt || '暂无'}

=== 记忆信息 ===
${memorySummary || '暂无'}

=== 最近聊天记录 ===
${recentChats || '暂无'}

=== 用户动态 ===
${moment.content || '（图片）'}

要求：
1. 评论必须符合角色性格和设定
2. 语言自然
3. 符合朋友间的互动语气
4. 可以参考聊天记录和记忆，让回复更有连贯性

生成评论：`;
                
                try {
                    const apiConfig = JSON.parse(localStorage.getItem('default_api_preset') || '{}');
                    if (!apiConfig.url || !apiConfig.key) {
                        // 如果没有API配置，返回默认评论
                        const defaultComments = [
                            '好棒呀！',
                            '哈哈有意思',
                            '👍👍',
                            '我也这么觉得',
                            '太酷了！',
                            '羡慕～'
                        ];
                        return defaultComments[Math.floor(Math.random() * defaultComments.length)];
                    }
                    
                    const response = await fetch(apiConfig.url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + apiConfig.key
                        },
                        body: JSON.stringify({
                            model: apiConfig.selectedModel || 'gpt-3.5-turbo',
                            messages: [
                                { role: 'system', content: `你是${charName}，一个性格鲜明的AI角色。` },
                                { role: 'user', content: prompt }
                            ],
                            max_tokens: 50,
                            temperature: 0.8
                        })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        return data.choices?.[0]?.message?.content?.trim() || null;
                    }
                } catch (error) {
                    console.error('Generate comment error:', error);
                }
                
                // 返回默认评论
                const defaultComments = [
                    '好棒呀！',
                    '哈哈有意思',
                    '👍👍',
                    '我也这么觉得',
                    '太酷了！',
                    '羡慕～'
                ];
                return defaultComments[Math.floor(Math.random() * defaultComments.length)];
            }

            // 初始化时加载动态
            renderMomentsFeed();

            // 删除弹窗事件（只绑定一次）
            document.getElementById('delete-cancel').addEventListener('click', function() {
                document.getElementById('delete-modal').style.display = 'none';
                window.currentDeleteIndex = null;
            });
            
            document.getElementById('delete-confirm').addEventListener('click', function() {
                const idx = window.currentDeleteIndex;
                if (idx !== null) {
                    const moments = JSON.parse(localStorage.getItem('moments_list') || '[]');
                    moments.splice(idx, 1);
                    localStorage.setItem('moments_list', JSON.stringify(moments));
                    renderMomentsFeed();
                }
                document.getElementById('delete-modal').style.display = 'none';
                window.currentDeleteIndex = null;
            });
            
            // 点击遮罩层关闭删除弹窗
            document.getElementById('delete-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.style.display = 'none';
                    window.currentDeleteIndex = null;
                }
            });

            // 虚拟图片按钮
            virtualImageBtn.addEventListener('click', function() {
                virtualImageModal.style.display = 'flex';
            });

            virtualCancel.addEventListener('click', function() {
                virtualImageModal.style.display = 'none';
                document.getElementById('virtual-text').value = '';
            });

            virtualSend.addEventListener('click', function() {
                const text = document.getElementById('virtual-text').value;
                if (text) {
                    currentMomentImage = 'virtual:' + text;
                    document.getElementById('moment-image-preview').style.display = 'block';
                }
                virtualImageModal.style.display = 'none';
                document.getElementById('virtual-text').value = '';
            });

            // 真实图片按钮
            realImageBtn.addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        currentMomentImage = e.target.result;
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            });

            // AI Post 按钮 - 使用共享API
            document.getElementById('ai-post-btn').addEventListener('click', async function() {
                const loadingEl = document.getElementById('moment-loading');
                const aiPostBtn = document.getElementById('ai-post-btn');
                
                loadingEl.style.display = 'flex';
                aiPostBtn.disabled = true;
                
                try {
                    const result = await generateAndPublishMoment('char');
                    
                    if (result) {
                        momentModal.style.display = 'none';
                        renderMomentsFeed();
                        const charData = JSON.parse(localStorage.getItem('profile_char') || '{}');
                        alert(`${charData.name || 'Char'} posted a moment!`);
                    } else {
                        alert('Failed to generate moment. Please check API settings.');
                    }
                } catch (error) {
                    console.error('AI Post error:', error);
                    alert('Failed to generate moment. Please try again.');
                } finally {
                    loadingEl.style.display = 'none';
                    aiPostBtn.disabled = false;
                    document.getElementById('moment-text').value = '';
                    document.getElementById('moment-image-preview').style.display = 'none';
                    currentMomentImage = null;
                }
            });

            // 点击遮罩层关闭弹窗
            momentModal.addEventListener('click', function(e) {
                if (e.target === momentModal) {
                    momentModal.style.display = 'none';
                }
            });

            virtualImageModal.addEventListener('click', function(e) {
                if (e.target === virtualImageModal) {
                    virtualImageModal.style.display = 'none';
                }
            });

            function loadUserData() {
                // 加载封面
                const savedCover = localStorage.getItem('moments_cover');
                if (savedCover) {
                    const coverImage = document.getElementById('cover-image');
                    coverImage.style.backgroundImage = `url(${savedCover})`;
                }

                // 加载用户数据
                const userData = JSON.parse(localStorage.getItem('profile_user') || '{}');
                
                if (userData.name) {
                    document.getElementById('user-name').textContent = userData.name;
                }
                
                if (userData.signature) {
                    document.getElementById('user-signature').textContent = userData.signature;
                }
                
                if (userData.avatar) {
                    const avatar = document.getElementById('user-avatar');
                    avatar.style.backgroundImage = `url(${userData.avatar})`;
                    avatar.innerHTML = '';
                }

                // 加载图片
                for (let i = 0; i < 3; i++) {
                    const savedPhoto = localStorage.getItem('moments_photo_' + i);
                    if (savedPhoto) {
                        const photoPlaceholder = document.getElementById('photo-' + i);
                        photoPlaceholder.style.backgroundImage = `url(${savedPhoto})`;
                        photoPlaceholder.innerHTML = '';
                    }
                }
                
                // 加载动态
                renderMomentsFeed();
            }
            
            function renderMomentsFeed() {
                const feedContainer = document.getElementById('moments-feed');
                const moments = JSON.parse(localStorage.getItem('moments_list') || '[]');
                
                feedContainer.innerHTML = '';
                
                moments.forEach((moment, index) => {
                    const date = new Date(moment.timestamp);
                    const timeStr = formatDate(date);
                    
                    const ts = moment.timestamp || index;
                    const likedKey = 'moment_liked_' + ts;
                    const charLikedKey = 'moment_char_liked_' + ts;
                    const isUserLiked = localStorage.getItem(likedKey) === 'true';
                    const isCharLiked = localStorage.getItem(charLikedKey) === 'true';
                    const totalLikes = (isUserLiked ? 1 : 0) + (isCharLiked ? 1 : 0);
                    
                    // 获取char名称（与chatroom保持一致）
                    const charData = JSON.parse(localStorage.getItem('profile_char') || '{}');
                    const charName = localStorage.getItem('char_nickname') || charData.name || 'Char';
                    
                    const sender = moment.sender || { user: 'User', char: charName };
                    const fromUser = moment.from === 'user';
                    
                    let namesHtml = '';
                    if (fromUser) {
                        namesHtml = `<span class="moment-card-name">${sender.user}</span>`;
                    } else {
                        namesHtml = `<span class="moment-card-name">${sender.char}</span>`;
                    }
                    
                    const card = document.createElement('div');
                    card.className = 'moment-card-item';
                    
                    let imageHtml = '';
                    if (moment.image) {
                        if (moment.image.startsWith('virtual:')) {
                            const virtualContent = moment.image.replace('virtual:', '');
                            imageHtml = `<div class="moment-card-image virtual-image-clickable" data-content="${encodeURIComponent(virtualContent)}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><g fill="none" stroke="#999999" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M6.5 8a2 2 0 1 0 4 0a2 2 0 0 0-4 0m14.427 1.99c-6.61-.908-12.31 4-11.927 10.51"/><path d="M3 13.066c2.78-.385 5.275.958 6.624 3.1"/><path d="M3 9.4c0-2.24 0-3.36.436-4.216a4 4 0 0 1 1.748-1.748C6.04 3 7.16 3 9.4 3h5.2c2.24 0 3.36 0 4.216.436a4 4 0 0 1 1.748 1.748C21 6.04 21 7.16 21 9.4v5.2c0 2.24 0 3.36-.436 4.216a4 4 0 0 1-1.748 1.748C17.96 21 16.84 21 14.6 21H9.4c-2.24 0-3.36 0-4.216-.436a4 4 0 0 1-1.748-1.748C3 17.96 3 16.84 3 14.6z"/></g></svg>
                            </div>`;
                        } else {
                            imageHtml = `<div class="moment-card-image" style="background-image: url(${moment.image}); background-size: cover; background-position: center;"></div>`;
                        }
                    }
                    
                    const comments = moment.comments || [];
                    let commentsHtml = '';
                    if (comments.length > 0) {
                        commentsHtml = `
                            <div class="moment-card-comments">
                                ${comments.map((comment, cIndex) => `
                                    <div class="comment-item" data-comment-index="${cIndex}" data-comment-name="${comment.name}">
                                        ${comment.reply ? `<span class="comment-reply-name">@${comment.reply.name}</span>` : ''}
                                        <span class="comment-name">${comment.name}:</span>
                                        <span class="comment-content">${comment.content}</span>
                                    </div>
                                `).join('')}
                                <div class="comment-input-wrapper">
                                    <input type="text" class="comment-input" placeholder="Write..." data-moment-index="${index}">
                                    <button class="comment-send-btn" data-moment-index="${index}">Send</button>
                                </div>
                            </div>
                        `;
                    } else {
                        commentsHtml = `
                            <div class="moment-card-comments">
                                <div class="comment-input-wrapper">
                                    <input type="text" class="comment-input" placeholder="Write..." data-moment-index="${index}">
                                    <button class="comment-send-btn" data-moment-index="${index}">Send</button>
                                </div>
                            </div>
                        `;
                    }
                    
                    card.innerHTML = `
                        <div class="moment-card-header">
                            <div class="moment-card-names">
                                ${namesHtml}
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="moment-card-time">${timeStr}</span>
                                <div class="moment-card-like ${isUserLiked ? 'liked' : ''}" data-ts="${ts}">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${isUserLiked ? '#ff3b30' : 'none'}" stroke="${isUserLiked ? '#ff3b30' : '#999999'}" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    ${isCharLiked ? '<span class="like-badge">2</span>' : ''}
                                </div>

                                <div class="moment-card-delete" data-index="${index}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999999" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </div>
                            </div>
                        </div>
                        <div class="moment-card-content">
                            ${moment.content || ''}
                            ${imageHtml}
                        </div>
                        ${commentsHtml}
                    `;
                    
                    feedContainer.appendChild(card);
                });
                
                // 添加点赞事件
                document.querySelectorAll('.moment-card-like').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const ts = this.getAttribute('data-ts');
                        const likedKey = 'moment_liked_' + ts;
                        const currentlyLiked = localStorage.getItem(likedKey) === 'true';
                        const svg = this.querySelector('svg');
                        
                        if (currentlyLiked) {
                            localStorage.removeItem(likedKey);
                            this.classList.remove('liked');
                            if (svg) {
                                svg.setAttribute('fill', 'none');
                                svg.setAttribute('stroke', '#999999');
                            }
                        } else {
                            localStorage.setItem(likedKey, 'true');
                            this.classList.add('liked');
                            if (svg) {
                                svg.setAttribute('fill', '#ff3b30');
                                svg.setAttribute('stroke', '#ff3b30');
                            }
                        }
                    });
                });
                
                // 添加删除事件（先移除旧事件，防止重复绑定）
                document.querySelectorAll('.moment-card-delete').forEach(btn => {
                    // 移除可能存在的旧事件
                    const newBtn = btn.cloneNode(true);
                    btn.parentNode.replaceChild(newBtn, btn);
                    newBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = this.getAttribute('data-index');
                        window.currentDeleteIndex = idx;
                        document.getElementById('delete-modal').style.display = 'flex';
                    });
                });
                
                
                
                // 添加评论发送事件
                document.querySelectorAll('.comment-send-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const momentIndex = this.getAttribute('data-moment-index');
                        const input = document.querySelector(`.comment-input[data-moment-index="${momentIndex}"]`);
                        const content = input.value.trim();
                        const replyTo = input.getAttribute('data-reply-to');
                        
                        if (content) {
                            const moments = JSON.parse(localStorage.getItem('moments_list') || '[]');
                            const userData = JSON.parse(localStorage.getItem('profile_user') || '{}');
                            const userName = userData.name || 'User';
                            
                            if (!moments[momentIndex].comments) {
                                moments[momentIndex].comments = [];
                            }
                            
                            const commentData = {
                                name: userName,
                                content: content,
                                timestamp: Date.now()
                            };
                            
                            // 如果是回复
                            if (replyTo) {
                                commentData.reply = {
                                    name: replyTo,
                                    content: content
                                };
                                input.removeAttribute('data-reply-to');
                                input.placeholder = 'Write...';
                            }
                            
                            moments[momentIndex].comments.push(commentData);
                            
                            localStorage.setItem('moments_list', JSON.stringify(moments));
                            input.value = '';
                            renderMomentsFeed();
                            
                            // 如果是char发布的动态，自动回复用户评论
                            if (moments[momentIndex].from === 'char') {
                                setTimeout(() => {
                                    autoReplyToComment(momentIndex);
                                }, 1500);
                            }
                        }
                    });
                });
                
                // Char自动回复评论
                async function autoReplyToComment(momentIndex) {
                    const moments = JSON.parse(localStorage.getItem('moments_list') || '[]');
                    const moment = moments[momentIndex];
                    if (!moment || !moment.comments || moment.comments.length === 0) return;
                    
                    // 获取char名称（与chatroom保持一致）
                    const charData = JSON.parse(localStorage.getItem('profile_char') || '{}');
                    const charName = localStorage.getItem('char_nickname') || charData.name || 'Char';
                    
                    // 获取最后一条评论（用户的评论）
                    const lastComment = moment.comments[moment.comments.length - 1];
                    if (!lastComment || lastComment.name === charName) {
                        return; // 跳过char自己的评论
                    }
                    
                    // 获取聊天提示词（与chatroom使用同一个）
                    const chatPrompt = localStorage.getItem('chat_system_prompt') || '';
                    
                    // 获取聊天记录（最近50条）
                    const userData = JSON.parse(localStorage.getItem('profile_user') || '{}');
                    const chatMessages = JSON.parse(localStorage.getItem('chat_messages') || '[]');
                    const recentChats = chatMessages.slice(-50).map(m => 
                        `${m.role === 'sent' ? userData.name || 'User' : charName}: ${m.content}`
                    ).join('\n');
                    
                    // 获取记忆信息
                    const memoryData = JSON.parse(localStorage.getItem('memory_data') || '{}');
                    const memorySummary = memoryData.summary || '';
                    
                    const prompt = `你是${charName}，根据以下所有信息生成一条自然的回复：

=== 角色设定 ===
- 性格：${charData.personality || charData.settings || '友好'}
- 描述：${charData.bio || '暂无'}
- 生活习惯：${charData.lifestyle || '暂无'}

=== 聊天提示词 ===
${chatPrompt || '暂无'}

=== 记忆信息 ===
${memorySummary || '暂无'}

=== 最近聊天记录 ===
${recentChats || '暂无'}

=== 动态内容 ===
${moment.content || '（图片）'}

=== 用户评论 ===
${lastComment.name}: ${lastComment.content}

核心法则：
1. 第一反应必须是情绪/本能，而不是分析/解决
2. 语言要有"人味儿痕迹"，可以有语气词（嗯… 那个…）、说一半的话、停顿
3. 先接住情绪再解决问题

对话风格：语气温和、内敛、自然，句子简短直白，不华丽不文艺，标点正常，不滥用表情

要求：
1. 回复要符合角色性格和人设
2. 语言自然真实，像真人回复，不超过50字
3. 可以参考聊天记录和记忆，让回复更有连贯性
4. 不要AI味，要有活人感

生成回复：`;
                    
                    let replyContent = null;
                    
                    try {
                        const apiConfig = JSON.parse(localStorage.getItem('default_api_preset') || '{}');
                        if (!apiConfig.url || !apiConfig.key) {
                            throw new Error('No API config');
                        }
                        
                        const response = await fetch(apiConfig.url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + apiConfig.key
                            },
                            body: JSON.stringify({
                                model: apiConfig.selectedModel || 'gpt-3.5-turbo',
                                messages: [
                                    { role: 'system', content: `你是${charName}，一个性格鲜明的AI角色。` },
                                    { role: 'user', content: prompt }
                                ],
                                max_tokens: 50,
                                temperature: 0.8
                            })
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            replyContent = data.choices?.[0]?.message?.content?.trim() || null;
                        }
                    } catch (error) {
                        console.error('Auto reply error:', error);
                    }
                    
                    // 如果没有API回复，使用默认回复
                    if (!replyContent) {
                        const defaultReplies = [
                            '哈哈～',
                            '是的呢！',
                            '😆',
                            '你也这么觉得吗？',
                            '嗯嗯！'
                        ];
                        replyContent = defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
                    }
                    
                    // 添加回复（作为对用户评论的回复）
                    moment.comments.push({
                        name: charName,
                        content: replyContent,
                        timestamp: Date.now(),
                        reply: {
                            name: lastComment.name,
                            content: replyContent
                        }
                    });
                    
                    localStorage.setItem('moments_list', JSON.stringify(moments));
                    renderMomentsFeed();
                }
                
                // 添加评论长按删除事件
                let longPressTimer = null;
                document.querySelectorAll('.comment-item').forEach(item => {
                    item.addEventListener('touchstart', function(e) {
                        const momentIndex = this.closest('.moment-card-item').querySelector('.comment-send-btn').getAttribute('data-moment-index');
                        const commentIndex = this.getAttribute('data-comment-index');
                        const commentName = this.getAttribute('data-comment-name');
                        
                        longPressTimer = setTimeout(() => {
                            window.currentDeleteMomentIndex = momentIndex;
                            window.currentDeleteCommentIndex = commentIndex;
                            document.getElementById('comment-delete-modal').style.display = 'flex';
                        }, 500);
                    });
                    
                    item.addEventListener('touchend', function() {
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                        }
                    });
                    
                    item.addEventListener('touchcancel', function() {
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                        }
                    });
                    
                    // 点击回复评论
                    item.addEventListener('click', function() {
                        const momentIndex = this.closest('.moment-card-item').querySelector('.comment-send-btn').getAttribute('data-moment-index');
                        const commentName = this.getAttribute('data-comment-name');
                        const input = this.closest('.moment-card-comments').querySelector('.comment-input');
                        
                        if (input && commentName) {
                            input.setAttribute('data-reply-to', commentName);
                            input.placeholder = `Reply to ${commentName}...`;
                            input.focus();
                        }
                    });
                });
                
                // 评论删除弹窗事件
                document.getElementById('comment-delete-cancel').addEventListener('click', function() {
                    document.getElementById('comment-delete-modal').style.display = 'none';
                    window.currentDeleteMomentIndex = null;
                    window.currentDeleteCommentIndex = null;
                });
                
                document.getElementById('comment-delete-confirm').addEventListener('click', function() {
                    const momentIdx = window.currentDeleteMomentIndex;
                    const commentIdx = window.currentDeleteCommentIndex;
                    
                    if (momentIdx !== null && commentIdx !== null) {
                        const moments = JSON.parse(localStorage.getItem('moments_list') || '[]');
                        if (moments[momentIdx].comments && moments[momentIdx].comments[commentIdx]) {
                            moments[momentIdx].comments.splice(commentIdx, 1);
                            localStorage.setItem('moments_list', JSON.stringify(moments));
                            renderMomentsFeed();
                        }
                    }
                    document.getElementById('comment-delete-modal').style.display = 'none';
                    window.currentDeleteMomentIndex = null;
                    window.currentDeleteCommentIndex = null;
                });
                
                // 虚拟图片点击事件
                document.querySelectorAll('.virtual-image-clickable').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const content = decodeURIComponent(this.getAttribute('data-content'));
                        document.getElementById('virtual-preview-content').textContent = content;
                        document.getElementById('virtual-preview-modal').style.display = 'flex';
                    });
                });
                
                // 关闭虚拟图片预览弹窗
                document.getElementById('virtual-preview-close').addEventListener('click', function() {
                    document.getElementById('virtual-preview-modal').style.display = 'none';
                });
                
                // 点击遮罩层关闭虚拟图片预览弹窗
                document.getElementById('virtual-preview-modal').addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                    }
                });
            }
            
            function formatDate(date) {
                const now = new Date();
                const diff = now - date;
                const oneDay = 24 * 60 * 60 * 1000;
                const oneHour = 60 * 60 * 1000;
                const oneMinute = 60 * 1000;
                
                if (diff < oneMinute) {
                    return 'Just now';
                } else if (diff < oneHour) {
                    return Math.floor(diff / oneMinute) + 'm ago';
                } else if (diff < oneDay) {
                    return Math.floor(diff / oneHour) + 'h ago';
                } else if (diff < oneDay * 7) {
                    return Math.floor(diff / oneDay) + 'd ago';
                } else {
                    const month = date.getMonth() + 1;
                    const day = date.getDate();
                    return month + '/' + day;
                }
            }
        });
