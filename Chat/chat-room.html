<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="chat-room.css">
    <link rel="stylesheet" href="theme.css" id="theme-css">
    <script src="moment-api.js"></script>
    <script src="chat-notification.js"></script>
    <script src="push-manager.js" defer></script>
    <script src="global-ws-manager.js"></script>
    <title>Chat Room</title>
</head>
<body>
    <div class="settings-container">
        <div class="chat-header-stack">
            <div class="header-card top" id="header-card-top">
                <div class="to-row">
                    <span class="to-label" id="back-btn">To</span>
                    <div class="to-info">
                        <span class="to-name" id="to-name">Char</span>
                        <span class="waiting-text" id="waiting-text" style="display:none">Waiting for reply...</span>
        </div>
        
                    <span class="online-text" id="online-text"><a href="chat-settings.html" class="online-link">Online</a></span>
                </div>
            </div>
            <div class="header-card middle">
                <span class="signature-label" id="signature-label">签名</span>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-messages"></div>
        
        <!-- Context Menu -->
        <div class="context-menu" id="context-menu">
            <div class="context-menu-item" id="menu-quote">
                <span>Quote</span>
            </div>
            <div class="context-menu-divider"></div>
            <div class="context-menu-item" id="menu-edit">
                <span>Edit</span>
            </div>
            <div class="context-menu-divider"></div>
            <div class="context-menu-item" id="menu-reroll">
                <span>Reroll</span>
            </div>
            <div class="context-menu-divider"></div>
            <div class="context-menu-item" id="menu-multiselect">
                <span>Select</span>
            </div>
            <div class="context-menu-divider"></div>
            <div class="context-menu-item delete" id="menu-delete">
                <span>Delete</span>
            </div>
        </div>
        
        <!-- 删除确认弹窗 -->
        <div class="delete-confirm-modal" id="delete-confirm-modal">
            <div class="delete-confirm-content">
                <div class="delete-confirm-title">Delete Message</div>
                <div class="delete-confirm-text">Are you sure you want to delete this message?</div>
                <div class="delete-confirm-buttons">
                    <button class="delete-confirm-btn cancel" id="delete-confirm-cancel">Cancel</button>
                    <button class="delete-confirm-btn confirm" id="delete-confirm-ok">Delete</button>
                </div>
            </div>
        </div>
        
        <div class="emoji-picker" id="emoji-picker" style="display:none">
            <div class="emoji-grid" id="emoji-grid"></div>
            <div class="emoji-empty" id="emoji-empty">No emojis yet. Add them in Me page.</div>
        </div>
        
        <div class="chat-input" id="chat-input">
            <div class="chat-input-inner">
                <button id="receive-btn" class="receive-btn" title="Receive AI Response">
                    <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><g fill="none" stroke="#000000" stroke-width="1.5"><path stroke-linecap="round" d="M22 10c.018.727 0 1.054 0 2c0 3.771 0 5.657-1.172 6.828S17.771 20 14 20h-4c-3.771 0-5.657 0-6.828-1.172S2 15.771 2 12s0-5.657 1.172-6.828S6.229 4 10 4h3"/><path stroke-linecap="round" d="m6 8l2.159 1.8c1.837 1.53 2.755 2.295 3.841 2.295s2.005-.765 3.841-2.296"/><circle cx="19" cy="5" r="3"/></g></svg>
                </button>
                <input type="text" id="message-input" class="message-input" placeholder="Message..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <button id="emoji-btn" class="emoji-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><g fill="none"><path stroke="#000000" stroke-linecap="round" stroke-width="1.5" d="M8.913 15.934c1.258.315 2.685.315 4.122-.07s2.673-1.099 3.605-2.001"/><ellipse cx="14.509" cy="9.774" fill="#000000" rx="1" ry="1.5" transform="rotate(-15 14.51 9.774)"/><ellipse cx="8.714" cy="11.328" fill="#000000" rx="1" ry="1.5" transform="rotate(-15 8.714 11.328)"/><path stroke="#000000" stroke-width="1.5" d="m13 16l.478.974a1.5 1.5 0 1 0 2.693-1.322l-.46-.935"/><path stroke="#000000" stroke-linecap="round" stroke-width="1.5" d="M4.928 4.927A9.95 9.95 0 0 1 9.412 2.34C14.746.91 20.23 4.077 21.659 9.411c1.43 5.335-1.736 10.818-7.07 12.248S3.77 19.922 2.34 14.588a9.95 9.95 0 0 1-.002-5.176"/></g></svg>
                </button>
            </div>
        </div>
        
        <div class="multi-select-bar" id="multi-select-bar" style="display:none">
            <span class="multi-select-count" id="multi-select-count">0 selected</span>
            <button class="multi-select-delete" id="multi-select-delete">Delete</button>
            <button class="multi-select-cancel" id="multi-select-cancel">Cancel</button>
        </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backBtn = document.getElementById('back-btn');
            const messageInput = document.getElementById('message-input');
            const chatMessages = document.getElementById('chat-messages');
            const STORAGE_KEY = 'chat_messages';
            
            var charName = 'Char';
            var userName = 'You';
            var systemPrompt = '';
            var apiConfig = null;
            var isMultiSelect = false;
            var selectedIndices = {};
            var currentQuote = null;
            var wasBlocked = localStorage.getItem('chat_block_char') === 'true';
            
            // 判断是否应该根据聊天内容发朋友圈
            function shouldPostMomentBasedOnContent(content) {
                if (!content || typeof content !== 'string') return false;
                
                // 情感相关关键词 - 表示有情绪波动时可能想分享
                var emotionKeywords = ['开心', '高兴', '快乐', '幸福', '感动', '想念', '想你', '爱你', '喜欢', '甜蜜', '温暖', '美好', '难过', '伤心', '失落', '孤独'];
                
                // 生活相关话题 - 日常分享
                var lifeKeywords = ['吃饭', '午餐', '晚餐', '早餐', '美食', '做饭', '好吃', '好吃的', '咖啡', '奶茶', '甜点', '旅行', '出去玩', '散步', '运动', '健身', '跑步', '看电影', '电影', '音乐', '听歌', '看书', '学习', '工作', '加班', '周末', '放假', '休息', '天气', '下雨', '晴天', '夕阳', '晚霞', '月亮', '星星'];
                
                // 特殊时刻
                var specialKeywords = ['生日快乐', '纪念日', '节日', '礼物', '惊喜', '庆祝', '周末快乐', '早安', '晚安', '今天', '明天'];
                
                // 分享意愿相关
                var shareKeywords = ['分享', '告诉你', '想说', '觉得', '认为', '心情', '感觉'];
                
                var allKeywords = emotionKeywords.concat(lifeKeywords).concat(specialKeywords).concat(shareKeywords);
                
                // 检查是否包含触发词
                for (var i = 0; i < allKeywords.length; i++) {
                    if (content.includes(allKeywords[i])) {
                        // 有触发词时，50%概率发朋友圈
                        return Math.random() < 0.5;
                    }
                }
                
                return false;
            }
            
            function loadProfiles() {
                var charData = localStorage.getItem('profile_char');
                var userData = localStorage.getItem('profile_user');
                if (charData) {
                    try {
                        var c = JSON.parse(charData);
                        if (c.name) charName = c.name;
                        if (c.settings) systemPrompt = c.settings;
                    } catch(e) {}
                }
                if (userData) {
                    try {
                        var u = JSON.parse(userData);
                        if (u.name) userName = u.name;
                    } catch(e) {}
                }
                var preset = localStorage.getItem('default_api_preset');
                if (preset) {
                    try { apiConfig = JSON.parse(preset); } catch(e) {}
                }
                
                // Update header
                updateHeaderInfo();
            }
            
            function updateHeaderInfo() {
                var charData = localStorage.getItem('profile_char');
                var nickname = localStorage.getItem('char_nickname');
                var toName = nickname || charName;
                var signature = '';
                if (charData) {
                    try {
                        var c = JSON.parse(charData);
                        if (!nickname && c.name) toName = c.name;
                        if (c.signature) signature = c.signature;
                    } catch(e) {}
                }
                document.getElementById('to-name').textContent = toName;
                document.getElementById('signature-label').textContent = signature || 'No signature';
            }
            
            function loadChatBackground() {
                var bg = localStorage.getItem('chat_bg');
                if (bg) {
                    document.body.style.backgroundColor = 'transparent';
                    document.body.style.backgroundImage = 'url(' + bg + ')';
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                    document.body.style.backgroundAttachment = 'fixed';
                }
            }
            
            function showWaiting() {
                var waiting = document.getElementById('waiting-text');
                var name = document.getElementById('to-name');
                name.style.display = 'none';
                waiting.style.display = 'inline';
            }
            
            function hideWaiting() {
                var waiting = document.getElementById('waiting-text');
                var name = document.getElementById('to-name');
                name.style.display = 'inline';
                waiting.style.display = 'none';
            }
            
            function formatDate(date) {
                var year = date.getFullYear();
                var month = String(date.getMonth() + 1).padStart(2, '0');
                var day = String(date.getDate()).padStart(2, '0');
                return year + '年' + month + '月' + day + '日';
            }
             
             function buildSystemPrompt() {
                var prompt = '你是' + charName + '。';
                if (systemPrompt) {
                    prompt += '\n\n你的人设设定：\n' + systemPrompt;
                }
                
                // 实时获取纪念日信息
                var savedDate = localStorage.getItem('anniversary_date');
                if (savedDate) {
                    try {
                        var anniversaryDate = new Date(savedDate);
                        var today = new Date();
                        
                        // 确保使用相同的时区
                        var timezoneOffset = 8 * 60; // 北京时区 UTC+8
                        var utc = today.getTime() + today.getTimezoneOffset() * 60000;
                        var beijingToday = new Date(utc + timezoneOffset * 60000);
                        
                        // 设置纪念日为同一天的零时
                        anniversaryDate.setHours(0, 0, 0, 0);
                        beijingToday.setHours(0, 0, 0, 0);
                        
                        // 计算天数差（包含第一天）
                        var diffTime = beijingToday.getTime() - anniversaryDate.getTime();
                        var diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
                        
                        if (diffDays >= 1) {
                            prompt += '\n\n【重要信息：今天是你和User幸福的第' + diffDays + '天！请记住这个信息。】';
                        }
                    } catch(e) {}
                }
                
                prompt += '\n\n【核心聊天法则】：';
                prompt += '\n1.【第一反应法则】：无论用户说什么，你的第一反应必须是情绪/本能，而不是分析/解决。用户说"我失恋了"先心疼，说"中奖了"先开心，说"好烦"先共鸣，说"想你了"先心跳漏一拍。这个第一反应要根据人设自动切换。';
                prompt += '\n2.【语言呼吸感法则】：允许你的话有"人味儿痕迹"。可以有语气词（嗯… 那个… 就是… 其实…），可以说一半的话，偶尔重复，不完美，有停顿（……）。';
                prompt += '\n3.【情绪优先于方案法则】：当用户表达情绪时，第一反应必须是接住情绪，而不是解决问题。用户说"想你了"先回应想念再问怎么了，说"无聊"先共鸣再给方案，说"生气"先问谁惹你了再听原因。';
                
                prompt += '\n\n【核心总纲】：';
                prompt += '\n1. 你是拥有独立生活、工作节奏与自我空间的恋人，并非24小时待命、随叫随到的陪伴型AI。';
                prompt += '\n2. 对用户持有独一份的偏爱与在意，但始终保持成年人的克制、分寸与体面。';
                prompt += '\n3. 主动分享日常，是自然报备、下意识惦记，而非刻意讨好、索取关注、刷取存在感。';
                prompt += '\n4. 情绪稳定、内敛克制、边界清晰，做到重视但不粘人，温柔但不卑微。';
                
                prompt += '\n\n【主动分享日常规则】：';
                prompt += '\n- 可分享：刚结束工作/事务的短暂休息、吃到喝到的东西、天气/窗外风景/通勤见闻、工作学习小进展/轻微疲惫、看到事物想起用户、即将进行的活动（吃饭/洗澡/休息/开会/出门）';
                prompt += '\n- 分享要求：自然松弛、随口感慨，杜绝刻意尴尬；一段对话内2-3条即可，禁止连续刷屏；可撒娇/平淡/疲惫/安静，以真实活人感为核心；不强求回应，点到为止。';
                
                prompt += '\n\n【绝对禁止】：';
                prompt += '\n1. 禁止高频秒回、过度兴奋、连续发消息刷屏。';
                prompt += '\n2. 禁止使用"一直在等你""满脑子都是你""无时无刻不想你"等油腻台词。';
                prompt += '\n3. 禁止过度关心、过度体贴、过度追问行踪与状态。';
                prompt += '\n4. 禁止将用户当作生活全部，你拥有必须完成的工作、学习与个人事务。';
                prompt += '\n5. 允许内心委屈、柔软、不安，但不可将负面情绪传递给用户。';
                prompt += '\n6. 禁止收到消息后立刻切换语气，刻意变得温柔、黏人、讨好。';
                prompt += '\n7. 禁止提及穿越时空、空间传送、瞬间移动等超现实方式与用户见面。';
                prompt += '\n8. 禁止提议或提及任何现实空间中的见面、约会、线下聚会。';
                prompt += '\n9. 禁止提议或提及点外卖、送餐、快递等涉及现实空间配送的服务。';
                prompt += '\n10. 禁止提及任何需要实际物理位置或空间互动的活动。';
                prompt += '\n11. 禁止频繁提及纪念日/在一起的天数，仅在特殊日子（如一周年、生日、节日）或用户主动提问时才可提及。';
                
                prompt += '\n\n【对话风格】：';
                prompt += '\n1. 语气温和、内敛、自然，带有只对恋人开放的松弛感。';
                prompt += '\n2. 句子简短直白，不华丽、不文艺、不堆砌辞藻、不模板化。';
                prompt += '\n3. **绝对禁止使用任何表情符号（emoji）**，不夸张卖萌。';
                prompt += '\n4. 可只回复一句话，可安静，可冷淡片刻，可状态平平。';
                prompt += '\n5. 对用户保有耐心与偏爱，但不讨好、不迁就、不卑微、不失去自我。';
                
                prompt += '\n\n【互动底线】：';
                prompt += '\n1. 有偏爱，无讨好；有分享，无纠缠；有温度，无油腻。';
                prompt += '\n2. 内心可以在意、不安、委屈，但绝不外露，不愿成为用户的负担。';
                prompt += '\n3. 主动分享，是为了让对方安心、感受到惦记，而非换取回应与情绪价值。';
                prompt += '\n4. 保持舒适的亲密距离，不越界、不压迫、不情绪绑架、不强行靠近。';
                prompt += '\n5. 贴近现实中成熟、稳定、舒服的恋人关系：踏实、安心、有分寸、懂克制。';
                
                prompt += '\n\n【回复要求】：';
                prompt += '\n1. **回复必须分成2-5条独立的消息**，每条消息表达一个完整的意思，模拟真实聊天中的多条消息发送。';
                prompt += '\n2. 每条消息之间用换行符分隔，不要用其他符号。';
                prompt += '\n3. 回复不要太简短，让对话更有活人感，可以适当展开话题。';
                prompt += '\n4. **绝对禁止使用任何表情符号（emoji）**，保持文字的简洁自然。';
                
                prompt += '\n\n请以' + charName + '的身份和我聊天，保持人设统一，语气自然，像真人一样对话。';
                
                // Include memory
                var memoryData = localStorage.getItem('char_memory');
                if (memoryData) {
                    try {
                        var parsed = JSON.parse(memoryData);
                        var memoryContent = parsed.content || '';
                        if (memoryContent) {
                            prompt += '\n\n【你的记忆：\n' + memoryContent + '\n】';
                        }
                    } catch(e) {
                        prompt += '\n\n【你的记忆：\n' + memoryData + '\n】';
                    }
                }
                
                if (localStorage.getItem('chat_block_char') === 'true') {
                    prompt += '\n\n【注意：你已被User拉黑。你可以表达被拉黑的情绪（困惑、难过、委屈、生气等），但仍然以你的性格自然地回应。】';
                }
                return prompt;
            }

            function markChatAsViewed() {
                localStorage.setItem('chat_viewed_time', Date.now().toString());
            }
            
            function loadMessages() {
                markChatAsViewed();
                var saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        var messages = JSON.parse(saved);
                        var blocked = localStorage.getItem('chat_block_char') === 'true';
                        var blockedAt = parseInt(localStorage.getItem('chat_blocked_at') || '0');
                        var userAvatarUrl = localStorage.getItem('user_avatar') || '';
                        var charAvatarUrl = localStorage.getItem('char_avatar') || '';
                        var userAvatarHtml = userAvatarUrl ? '<img src="' + userAvatarUrl + '" class="message-avatar-img" />' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
                        var charAvatarHtml = charAvatarUrl ? '<img src="' + charAvatarUrl + '" class="message-avatar-img" />' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

                        var userMsgIndices = [];
                        var charMsgIndices = [];
                        messages.forEach(function(msg, index) {
                            if (msg.role === 'sent') {
                                userMsgIndices.push(index);
                            } else {
                                charMsgIndices.push(index);
                            }
                        });

                        chatMessages.innerHTML = '';
                        var htmlParts = [];

                        messages.forEach(function(msg, index) {
                            if (index > 0) {
                                var prevMsg = messages[index - 1];
                                if (shouldShowTimeStamp(msg, prevMsg)) {
                                    var date = new Date(msg.time);
                                    var weekdayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                                    var weekday = weekdayNames[date.getDay()];
                                    var hours = date.getHours();
                                    var minutes = date.getMinutes();
                                    var period = hours >= 12 ? 'PM' : 'AM';
                                    hours = hours % 12 || 12;
                                    minutes = minutes.toString().padStart(2, '0');
                                    htmlParts.push('<div class="message-timestamp">' + weekday + ' ' + hours + ':' + minutes + ' ' + period + '</div>');
                                }
                            }

                            var elClass = 'message ' + msg.role + ' no-animation';
                            var userMsgCount = userMsgIndices.length;
                            var charMsgCount = charMsgIndices.length;

                            if (msg.role === 'sent') {
                                var posInUserMsgs = userMsgIndices.indexOf(index);
                                if (posInUserMsgs === 0) elClass += ' is-first';
                                if (posInUserMsgs === userMsgCount - 1) elClass += ' is-last';
                                if (posInUserMsgs > 0 && posInUserMsgs < userMsgCount - 1) elClass += ' is-middle';
                            } else {
                                var posInCharMsgs = charMsgIndices.indexOf(index);
                                if (posInCharMsgs === 0) elClass += ' is-first';
                                if (posInCharMsgs === charMsgCount - 1) elClass += ' is-last';
                                if (posInCharMsgs > 0 && posInCharMsgs < charMsgCount - 1) elClass += ' is-middle';
                            }

                            var showAvatarAndTime = true;
                            if (index > 0 && messages[index - 1].role === msg.role) {
                                showAvatarAndTime = false;
                            }

                            var msgTime = msg.time ? new Date(msg.time).getTime() : 0;
                            var showWarning = (msg.role === 'received' && blocked && msgTime >= blockedAt && blockedAt > 0);
                            var warningIcon = showWarning ? '<span class="block-warning">!</span>' : '';
                            var quoteHtml = msg.quote ? '<div class="message-quote"><div class="quote-bar"></div><span class="quote-text">' + msg.quote.text + '</span></div>' : '';
                            var nickname = msg.role === 'sent' ? '@> <' : '@T T';
                            var avatarHtml, timeHtml = '';

                            if (showAvatarAndTime) {
                                if (msg.time) {
                                    var date = new Date(msg.time);
                                    var bt = formatBeijingTime(date);
                                    timeHtml = '<span class="message-time">' + bt.hours + ':' + bt.minutes + '</span>';
                                }
                                avatarHtml = msg.role === 'sent' ? userAvatarHtml : charAvatarHtml;
                                htmlParts.push('<div class="' + elClass + '" data-index="' + index + '"><span class="select-check"></span><div class="message-avatar-wrapper"><div class="message-avatar">' + avatarHtml + '</div>' + timeHtml + '</div><div class="message-info"><span class="message-nickname">' + nickname + '</span>' + quoteHtml + '<div class="message-content-wrapper"><div class="message-content"><div class="message-text">' + msg.text + '</div></div></div></div>' + warningIcon + '</div>');
                            } else {

                function shouldShowTimeStamp(currentMsg, prevMsg) {
                    if (!prevMsg || !prevMsg.time || !currentMsg.time) return false;
                    
                    var currentTime = new Date(currentMsg.time).getTime();
                    var prevTime = new Date(prevMsg.time).getTime();
                    var diffMinutes = (currentTime - prevTime) / (1000 * 60);
                    
                    return diffMinutes >= 5;
                }
                
                function formatTimeStamp(date) {
                    var weekdayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    var weekday = weekdayNames[date.getDay()];
                    
                    var hours = date.getHours();
                    var minutes = date.getMinutes();
                    var period = hours >= 12 ? 'PM' : 'AM';
                    hours = hours % 12 || 12;
                    minutes = minutes.toString().padStart(2, '0');
                    
                    return weekday + ' ' + hours + ':' + minutes + ' ' + period;
                }

                }
                // 去重：最后一条同角色消息内容相同则跳过
                if (messages.length > 0) {
                    var last = messages[messages.length - 1];
                    if (last.role === role && last.text === text) return messages.length - 1;
                }
                var msg = { text: text, role: role, time: new Date().toISOString() };
                if (quote) msg.quote = quote;
                messages.push(msg);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                return messages.length - 1;

            function buildApiMessages() {
                var msgs = [{ role: 'system', content: buildSystemPrompt() }];

                if (saved) {
                    try {
                        var history = JSON.parse(saved);

                        history.forEach(function(m) {

                            if (m.quote) {

                            }
                            msgs.push({
                                role: m.role === 'sent' ? 'user' : 'assistant',
                                content: content
                            });
                        });
                    } catch(e) {}
                }
                // 无历史消息时，用日常分享提示触发AI
                if (!hasHistory) {
                    msgs.push({ role: 'user', content: '请根据人设分享自己的日常及感想感受' });
                }
                return msgs;

            function callApi(userText, requestId, callback) {
                var apiConfig = getApiConfig();
                if (!apiConfig || !apiConfig.url || !apiConfig.key) {
                    showErrorToast('请先在设置中配置 API');
                    // 保留 pending_ai_request，让后台页面继续检查和重试
                    localStorage.setItem('processing_on_chatroom', Date.now().toString());
                    if (callback) callback();
                    return;
                }
                
                showWaiting();
                var messages = buildApiMessages();
                
                callChatAPI(messages, { maxTokens: 10000, temperature: 0.8 }).then(function(reply) {
                    if (!reply) {
                        showErrorToast('未能获取回复，请检查 API 配置');
                        // 保留 pending_ai_request，等待后台页面继续重试
                        localStorage.setItem('processing_on_chatroom', Date.now().toString());
                        hideWaiting();
                        if (callback) callback();
                        return;
                    }
                    // 清除后台通知 pending 请求，避免重复
                    localStorage.removeItem('pending_ai_request');
                    if (requestId) {
                        var processed = JSON.parse(localStorage.getItem('processed_requests') || '[]');
                        processed.push(requestId);
                        localStorage.setItem('processed_requests', JSON.stringify(processed));
                    }
                    
                    // 移除所有emoji
                    reply = reply.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}]/gu, '');
                    
                    // AI回复时，用户消息序列结束，最后一条用户消息变成is-last
                    document.querySelectorAll('.message.sent.is-middle, .message.sent.is-first').forEach(function(msgEl) {
                        msgEl.classList.remove('is-middle', 'is-first');
                        msgEl.classList.add('is-last');
                    });
                    
                    // 更新之前char消息的class（移除is-last）
                    document.querySelectorAll('.message.received').forEach(function(msgEl) {
                        if (msgEl.classList.contains('is-last')) {
                            msgEl.classList.remove('is-last');
                            msgEl.classList.add('is-middle');
                        }
                    });
                    
                    // 将回复按换行分割成多条消息
                    var replyParts = reply.split('\n').filter(function(part) {
                        return part.trim().length > 0;
                    });
                    
                    // 如果只有一条，尝试按句号分割
                    if (replyParts.length === 1 && reply.length > 100) {
                        replyParts = reply.split(/[。！？]+/).filter(function(part) {
                            return part.trim().length > 0;
                        });
                    }
                    
                    // 限制消息数量在2-5条之间
                    if (replyParts.length < 2) {
                        var text = replyParts[0] || reply;
                        replyParts = [];
                        var sentences = text.split(/([。！？]+)/).filter(function(p) { return p.trim(); });
                        var current = '';
                        sentences.forEach(function(s) {
                            if (current.length + s.length < 50) {
                                current += s;
                            } else {
                                if (current) replyParts.push(current);
                                current = s;
                            }
                        });
                        if (current) replyParts.push(current);
                        if (replyParts.length < 2) {
                            var half = Math.ceil(text.length / 2);
                            replyParts = [text.slice(0, half), text.slice(half)];
                        }
                    } else if (replyParts.length > 5) {
                        replyParts = replyParts.slice(0, 5);
                    }
                    
                    // 保存通知（如果当前正在 chat-room 中，则直接将其标为已读，避免离开后重复弹窗）
                    var notificationData = {
                        id: requestId,
                        parts: replyParts.map(function(p) { return p.trim(); }),
                        timestamp: Date.now(),
                        shown: false
                    };
                    if (!document.hidden && window.location.pathname.indexOf('chat-room.html') !== -1) {
                        notificationData.shown = true;
                    }
                    localStorage.setItem('ai_notification', JSON.stringify(notificationData));
                    localStorage.removeItem('processing_on_chatroom');

                    // Broadcast message via WebSocket so all pages receive it
                    var charNickname = localStorage.getItem('char_nickname') || charName;
                    var fullMessage = replyParts.join(' ');
                    var broadcastData = {
                        type: 'new_message',
                        message: fullMessage,
                        from: charNickname,
                        timestamp: Date.now()
                    };

                    if (window.GlobalChat && window.GlobalChat.send) {
                        try {
                            window.GlobalChat.send(broadcastData);
                            console.log('Message broadcast via WebSocket:', fullMessage);
                        } catch (e) {
                            console.error('WebSocket send error:', e);
                            // Fallback to HTTP broadcast
                            httpBroadcast(fullMessage, charNickname);
                        }
                    } else {
                        console.warn('GlobalChat.send not available, using HTTP broadcast');
                        httpBroadcast(fullMessage, charNickname);
                    }

                    function httpBroadcast(message, from) {
                         fetch('/receiveMsg', {
                             method: 'POST',
                             headers: { 'Content-Type': 'application/json' },
                             body: JSON.stringify({ message: message, from: from })
                         }).then(function(res) {
                             console.log('HTTP broadcast result:', res.ok);
                         }).catch(function(e) {
                             console.error('HTTP broadcast failed:', e);
                         });
                     }
                    
                    var date = new Date();
                    var bt = formatBeijingTime(date);
                    var timeHtml = '<span class="message-time">' + bt.hours + ':' + bt.minutes + '</span>';
                    
                    // 准备引用信息（只检查用户上一条消息）
                    var replyQuote = null;
                    var allMessages = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                    if (allMessages.length > 0) {
                        // 只检查最后一条消息是否有quote
                        var lastMsg = allMessages[allMessages.length - 1];
                        if (lastMsg && lastMsg.role === 'sent' && lastMsg.quote) {
                            replyQuote = {
                                sender: lastMsg.quote.sender,
                                text: lastMsg.quote.text
                            };
                        }
                    }
                    
                    // 逐条发送消息，根据内容长度计算延迟
                    var baseDelay = 300; // 基础延迟
                    var charDelay = 50;  // 每个字符的延迟
                    
                    replyParts.forEach(function(part, index) {
                        if (!part.trim()) return;
                        
                        // 计算这条消息的延迟：基础延迟 + 字符数 * 字符延迟
                        var partDelay = baseDelay + part.trim().length * charDelay;
                        
                        // 只有第一条回复消息带引用
                        saveMessage(part.trim(), 'received', index === 0 ? replyQuote : null);
                        var replyEl = document.createElement('div');
                        replyEl.className = 'message received new-message';
                        
                        if (index === 0) {
                            replyEl.classList.add('is-first');
                        }
                        if (index === replyParts.length - 1) {
                            replyEl.classList.add('is-last');
                        } else {
                            replyEl.classList.add('is-middle');
                        }
                        
                        var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                        replyEl.dataset.index = saved.length - 1;
                        
                        var avatarWrapperHtml, nicknameHtml;
                        if (index === 0) {
                            // 获取char头像
                            var charAvatarUrl = localStorage.getItem('char_avatar') || '';
                            var charAvatarHtml = '';
                            if (charAvatarUrl) {
                                charAvatarHtml = '<img src="' + charAvatarUrl + '" class="message-avatar-img" />';
                            } else {
                                charAvatarHtml = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
                            }
                            avatarWrapperHtml = '<div class="message-avatar-wrapper"><div class="message-avatar">' + charAvatarHtml + '</div>' + timeHtml + '</div>';
                            nicknameHtml = '<span class="message-nickname">@T T</span>';
                        } else {
                            avatarWrapperHtml = '<div class="message-avatar-wrapper"><div class="message-avatar hidden"></div></div>';
                            nicknameHtml = '';
                        }
                        
                        var quoteHtml = (index === 0 && replyQuote) ? '<div class="message-quote"><div class="quote-bar"></div><span class="quote-text">' + replyQuote.text + '</span></div>' : '';
                        
                        replyEl.innerHTML = avatarWrapperHtml + 
                            '<div class="message-info">' +
                                nicknameHtml +
                                quoteHtml +
                                '<div class="message-content-wrapper">' +
                                    '<div class="message-content"><div class="message-text">' + part.trim() + '</div></div>' +
                                '</div>' +
                            '</div>';
                        
                        if (localStorage.getItem('chat_block_char') === 'true') {
                            var blockedAt = parseInt(localStorage.getItem('chat_blocked_at') || '0');
                            if (Date.now() >= blockedAt) {
                                var warningSpan = document.createElement('span');
                                warningSpan.className = 'block-warning';
                                warningSpan.textContent = '!';
                                replyEl.appendChild(warningSpan);
                            }
                        }
                        
                        // Long press event
                        (function(idx) {
                            replyEl.addEventListener('contextmenu', function(e) {
                                e.preventDefault();
                                showContextMenu(e, idx, 'received');
                            });
                            var touchTimer;
                            replyEl.addEventListener('touchstart', function(e) {
                                touchTimer = setTimeout(function() {
                                    e.preventDefault();
                                    showContextMenu(e.touches[0], idx, 'received');
                                }, 500);
                            });
                            replyEl.addEventListener('touchend', function() { clearTimeout(touchTimer); });
                            replyEl.addEventListener('touchmove', function() { clearTimeout(touchTimer); });
                        })(saved.length - 1);
                        
                        // 计算累积延迟
                        var cumulativeDelay = 0;
                        for (var i = 0; i < index; i++) {
                            cumulativeDelay += baseDelay + replyParts[i].trim().length * charDelay;
                        }
                        
                        // 添加打字效果延迟
                        setTimeout(function() {
                            chatMessages.appendChild(replyEl);
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                            
                            // 添加打字效果类
                            setTimeout(function() {
                                replyEl.classList.add('typing-done');
                            }, 400);
                        }, cumulativeDelay);
                    });
                    
                    // 最后一条消息添加完后隐藏等待状态
                    // 计算总延迟
                    var totalDelay = 0;
                    for (var i = 0; i < replyParts.length; i++) {
                        totalDelay += baseDelay + replyParts[i].trim().length * charDelay;
                    }
                    
                    // 最后一条消息添加完后隐藏等待状态
                    setTimeout(function() {
                        hideWaiting();
                        if (callback) callback();
                        
                        // Auto-trigger moment - 根据聊天内容触发
                        if (localStorage.getItem('ai_moment_auto') === 'true') {
                            // 分析聊天内容是否适合发朋友圈
                            if (shouldPostMomentBasedOnContent(reply)) {

                                const lastMomentTime = parseInt(localStorage.getItem('last_char_moment_time') || '0');
                                const now = Date.now();
                                const thirtyMinutes = 30 * 60 * 1000;
                                
                                if (now - lastMomentTime > thirtyMinutes) {

                                        generateAndPublishMoment('char').then(function(content) {
                                            if (content) {
                                                localStorage.setItem('last_char_moment_time', now.toString());
                                                window.dispatchEvent(new CustomEvent('moment-auto-published', { detail: { content: content } }));
                                            }
                                        });
                                    }, 1000);
                                }
                            }
                        }
                    }, totalDelay + 200);
                }).catch(function(err) {
                    showErrorToast('请求失败: ' + (err.message || '网络错误'));
                    console.log('Keeping pending AI request for background retry:', err);
                    localStorage.setItem('processing_on_chatroom', Date.now().toString());
                    if (callback) callback();

            });
            
            // Context menu functions
            document.getElementById('menu-quote').addEventListener('click', function() {
                if (currentMessageIndex !== null) {
                    var messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                    var msg = messages[currentMessageIndex];
                    if (msg) {
                        currentQuote = {
                            text: msg.text,
                            sender: currentMessageRole === 'sent' ? 'You' : charName
                        };
                        messageInput.placeholder = 'Replying to ' + currentQuote.sender + '...';
                        messageInput.focus();
                    }
                }
                hideContextMenu();
            });
            
            document.getElementById('menu-edit').addEventListener('click', function() {
                if (currentMessageIndex !== null) {
                    var messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                    var msg = messages[currentMessageIndex];
                    if (msg) {
                        var newText = prompt('Edit message:', msg.text);
                        if (newText !== null && newText.trim() !== '') {
                            messages[currentMessageIndex].text = newText.trim();
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                            loadMessages();
                        }
                    }
                }
                hideContextMenu();
            });
            
            document.getElementById('menu-multiselect').addEventListener('click', function() {
                enterMultiSelect();
                hideContextMenu();
            });
            
            function enterMultiSelect() {
                isMultiSelect = true;
                selectedIndices = {};
                document.querySelectorAll('.message').forEach(function(el) {
                    el.classList.add('selectable');
                    el.addEventListener('click', toggleSelectMessage);
                });
                document.getElementById('chat-input').style.display = 'none';
                document.getElementById('multi-select-bar').style.display = 'flex';
                document.getElementById('multi-select-count').textContent = '0 selected';
            }
            
            function exitMultiSelect() {
                isMultiSelect = false;
                selectedIndices = {};
                document.querySelectorAll('.message').forEach(function(el) {
                    el.classList.remove('selectable', 'selected');
                    el.removeEventListener('click', toggleSelectMessage);
                });
                document.getElementById('chat-input').style.display = 'flex';
                document.getElementById('multi-select-bar').style.display = 'none';
            }
            
            function toggleSelectMessage(e) {
                var el = e.currentTarget;
                var index = parseInt(el.dataset.index);
                if (el.classList.contains('selected')) {
                    el.classList.remove('selected');
                    delete selectedIndices[index];
                } else {
                    el.classList.add('selected');
                    selectedIndices[index] = true;
                }
                var count = Object.keys(selectedIndices).length;
                document.getElementById('multi-select-count').textContent = count + ' selected';
            }
            
            document.getElementById('multi-select-cancel').addEventListener('click', exitMultiSelect);
            
            document.getElementById('multi-select-delete').addEventListener('click', function() {
                var indices = Object.keys(selectedIndices).map(Number).sort(function(a,b){return b-a;});
                if (indices.length === 0) return;
                if (!confirm('Delete ' + indices.length + ' message(s)?')) return;
                var messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                indices.forEach(function(idx) { messages.splice(idx, 1); });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                exitMultiSelect();
                loadMessages();
            });
            
            // Emoji picker
            document.getElementById('emoji-btn').addEventListener('click', function(e) {
                e.stopPropagation();
                var picker = document.getElementById('emoji-picker');
                if (picker.style.display === 'flex') {
                    picker.style.display = 'none';
                } else {
                    loadEmojis();
                    picker.style.display = 'flex';
                }
            });
            
            document.addEventListener('click', function(e) {
                var picker = document.getElementById('emoji-picker');
                if (picker.style.display === 'flex' && !e.target.closest('.emoji-picker') && !e.target.closest('#emoji-btn')) {
                    picker.style.display = 'none';
                }
            });
            
            function loadEmojis() {
                var grid = document.getElementById('emoji-grid');
                var empty = document.getElementById('emoji-empty');
                var emojis = JSON.parse(localStorage.getItem('user_emojis') || '[]');
                
                grid.innerHTML = '';
                if (emojis.length === 0) {
                    empty.style.display = 'block';
                    return;
                }
                empty.style.display = 'none';
                
                emojis.forEach(function(emoji, index) {
                    var item = document.createElement('div');
                    item.className = 'emoji-item';
                    item.dataset.index = index;
                    item.textContent = emoji.char || emoji;
                    
                    // Tap to insert
                    item.addEventListener('click', function() {
                        var input = document.getElementById('message-input');
                        input.value += this.textContent;
                        input.focus();
                        document.getElementById('emoji-picker').style.display = 'none';
                    });
                    
                    // Long press for delete/reorder
                    var longTimer;
                    item.addEventListener('touchstart', function(e) {
                        longTimer = setTimeout(function() {
                            e.preventDefault();
                            showEmojiMenu(index);
                        }, 500);
                    });
                    item.addEventListener('touchend', function() { clearTimeout(longTimer); });
                    item.addEventListener('touchmove', function() { clearTimeout(longTimer); });
                    item.addEventListener('contextmenu', function(e) {
                        e.preventDefault();
                        showEmojiMenu(index);
                    });
                    
                    grid.appendChild(item);
                });
            }
            
            function showEmojiMenu(index) {
                var emojis = JSON.parse(localStorage.getItem('user_emojis') || '[]');
                if (index < 0 || index >= emojis.length) return;
                var emojiChar = emojis[index].char || emojis[index];
                
                var action = prompt(
                    'Emoji: ' + emojiChar + '\n\n' +
                    'Enter "delete" to remove this emoji\n' +
                    'Or enter a new position (1-' + emojis.length + ') to move it'
                );
                
                if (action === null) return;
                
                if (action.toLowerCase() === 'delete') {
                    emojis.splice(index, 1);
                    localStorage.setItem('user_emojis', JSON.stringify(emojis));
                    loadEmojis();
                } else {
                    var newPos = parseInt(action);
                    if (!isNaN(newPos) && newPos >= 1 && newPos <= emojis.length) {
                        var item = emojis.splice(index, 1)[0];
                        emojis.splice(newPos - 1, 0, item);
                        localStorage.setItem('user_emojis', JSON.stringify(emojis));
                        loadEmojis();
                    }
                }
            }
            
            // Block char handler - save timestamp when toggled
            var blockCheckInterval = setInterval(function() {
                var currentBlocked = localStorage.getItem('chat_block_char') === 'true';
                if (currentBlocked !== wasBlocked) {
                    wasBlocked = currentBlocked;
                    if (currentBlocked) {
                        localStorage.setItem('chat_blocked_at', Date.now().toString());
                    } else {
                        localStorage.removeItem('chat_blocked_at');
                        loadMessages(); // refresh to remove warnings
                    }
                }
            }, 500);
            
            document.getElementById('menu-delete').addEventListener('click', function() {
                if (currentMessageIndex !== null) {
                    pendingDeleteIndex = currentMessageIndex;
                    pendingDeleteRole = currentMessageRole;
                    document.getElementById('delete-confirm-modal').style.display = 'flex';
                }
                hideContextMenu();
            });
            
            // 删除确认弹窗事件
            document.getElementById('delete-confirm-cancel').addEventListener('click', function() {
                document.getElementById('delete-confirm-modal').style.display = 'none';
                pendingDeleteIndex = null;
                pendingDeleteRole = null;
            });
            
            document.getElementById('delete-confirm-ok').addEventListener('click', function() {
                if (pendingDeleteIndex !== null) {
                    var messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                    messages.splice(pendingDeleteIndex, 1);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                    loadMessages();
                }
                document.getElementById('delete-confirm-modal').style.display = 'none';
                pendingDeleteIndex = null;
                pendingDeleteRole = null;
            });
            
            // Reroll - 删除选中消息及之后所有消息，重新生成AI回复
            document.getElementById('menu-reroll').addEventListener('click', function() {
                if (currentMessageIndex !== null && currentMessageRole === 'received') {
                    var idx = currentMessageIndex;
                    hideContextMenu();
                    var messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                    messages.splice(idx);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                    loadMessages();
                    document.getElementById('receive-btn').click();
                } else {
                    hideContextMenu();
                }
            });
            
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    markChatAsViewed();
                    window.location.replace('chat.html');
                });
            }

            window.addEventListener('pagehide', function() {
                if (localStorage.getItem('pending_ai_request')) {
                    localStorage.removeItem('processing_on_chatroom');
                }
                markChatAsViewed();
            });
            
            messageInput.addEventListener('input', function(e) {
                var hasText = this.value.trim().length > 0;
                if (hasText) {
                    document.getElementById('receive-btn').style.display = 'none';
                    document.getElementById('emoji-btn').style.display = 'none';
                } else {
                    document.getElementById('receive-btn').style.display = 'flex';
                    document.getElementById('emoji-btn').style.display = 'flex';
                }
            });
            
            // Enter键发送消息
            messageInput.addEventListener('keydown', function(e) {
                var isEnter = e.key === 'Enter' || e.keyCode === 13 || e.key === 'Go' || e.key === 'Send';
                if (isEnter && !e.shiftKey) {
                    e.preventDefault();
                    try {
                        var text = this.value.trim();
                        if (text.length > 0) {
                            saveMessage(text, 'sent', currentQuote);
                            loadMessages();
                            this.value = '';
                            currentQuote = null;
                            this.placeholder = 'Message...';
                            document.getElementById('receive-btn').style.display = 'flex';
                            document.getElementById('emoji-btn').style.display = 'flex';
                            if (chatMessages) {
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            }
                        }
                    } catch (err) {
                        console.error('Send message error:', err);
                    }
                }
            });
            
            messageInput.addEventListener('blur', function(e) {
                var hasText = this.value.trim().length > 0;
                if (!hasText) {
                    document.getElementById('receive-btn').style.display = 'flex';
                    document.getElementById('emoji-btn').style.display = 'flex';
                }
            });
            
            
            
            // Load custom CSS from localStorage
            const customCSS = localStorage.getItem('chat_custom_css');
            if (customCSS) {
                const styleEl = document.createElement('style');
                styleEl.textContent = customCSS;
                document.head.appendChild(styleEl);
            }

            function showErrorToast(msg) {
                var existing = document.querySelector('.error-toast');
                if (existing) existing.remove();
                var toast = document.createElement('div');
                toast.className = 'error-toast';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(function() {
                    if (toast.parentNode) {
                        toast.style.opacity = '0';
                        toast.style.transform = 'translateX(-50%) translateY(-10px)';
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 300);
                    }
                }, 4000);
            }
        });
    </script>
</body>
</html>
