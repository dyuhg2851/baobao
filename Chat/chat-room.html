<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="chat-room.css">
    <title>Chat Room</title>
</head>
<body>
    <div class="settings-container">
        <div class="header">
            <button id="back-btn" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"/></svg>
            </button>
            <button id="voice-btn" class="voice-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><g fill="none"><path stroke="#000000" stroke-linecap="round" stroke-width="1.5" d="M18 12h-.801c-.83 0-1.245 0-1.589.195c-.344.194-.557.55-.984 1.261l-.03.052c-.398.663-.597.994-.886.989s-.476-.344-.849-1.022l-1.687-3.067c-.347-.632-.52-.948-.798-.963c-.277-.015-.484.28-.897.87l-.283.405c-.44.627-.659.94-.984 1.11c-.326.17-.709.17-1.474.17H6"/><path fill="#000000" d="m8.962 18.91l.464-.588zM12 5.5l-.54.52a.75.75 0 0 0 1.08 0zm3.038 13.41l.465.59zM12 20.487v-.75zm-9.343-7.09a.75.75 0 0 0 1.273-.792zm3.873 2.376a.75.75 0 0 0-1.06 1.062zM2.75 9.137c0-2.803 1.257-4.542 2.83-5.14c1.575-.6 3.771-.167 5.88 2.024l1.08-1.04C10.15 2.496 7.345 1.72 5.046 2.595C2.743 3.471 1.25 5.888 1.25 9.137zM15.503 19.5c1.492-1.177 3.28-2.754 4.703-4.516c1.407-1.743 2.544-3.775 2.544-5.847h-1.5c0 1.551-.872 3.246-2.211 4.905c-1.323 1.639-3.015 3.137-4.465 4.28zM22.75 9.137c0-3.25-1.493-5.666-3.796-6.542c-2.299-.874-5.103-.1-7.494 2.386l1.08 1.04c2.109-2.19 4.305-2.623 5.88-2.024c1.573.598 2.83 2.337 2.83 5.14zM8.497 19.5c1.275 1.004 2.153 1.736 3.503 1.736v-1.5c-.73 0-1.184-.319-2.574-1.414zm6.077-1.178c-1.39 1.095-1.843 1.414-2.574 1.414v1.5c1.35 0 2.228-.732 3.503-1.736zM3.93 12.604c-.746-1.199-1.18-2.373-1.18-3.467h-1.5c0 1.48.58 2.932 1.407 4.26zm5.496 5.718a34 34 0 0 1-2.896-2.55l-1.06 1.062A35 35 0 0 0 8.497 19.5z"/></g></svg>
            </button>
        </div>
        
        <div class="chat-messages" id="chat-messages"></div>
        
        <div class="chat-input">
            <input type="text" id="message-input" class="message-input" placeholder="Message...">
            <button id="send-btn" class="send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" fill-rule="evenodd" d="M18.21 5.19c-.424.076-1.003.268-1.847.55l-6.49 2.163c-.823.274-1.42.473-1.855.643c-.452.176-.65.293-.733.372a1.5 1.5 0 0 0 0 2.164c.083.08.281.196.733.372a45 45 0 0 0 1.893.656c.292.097.494.164.677.261a2.5 2.5 0 0 1 1.04 1.041c.098.183.165.385.262.677l.013.039c.274.822.473 1.42.643 1.854c.176.452.293.65.373.733a1.5 1.5 0 0 0 2.163 0c.08-.083.196-.281.372-.733c.17-.434.37-1.032.643-1.854l2.164-6.491c.281-.844.473-1.424.548-1.847c.076-.428.001-.525-.037-.562c-.037-.038-.134-.113-.562-.037m-.175-.984c.51-.09 1.045-.085 1.445.314c.399.4.404.935.314 1.445c-.09.505-.306 1.154-.57 1.947l-.015.04l-2.163 6.492l-.005.015a45 45 0 0 1-.655 1.887c-.175.446-.35.82-.583 1.062a2.5 2.5 0 0 1-3.606 0c-.232-.243-.408-.616-.583-1.062c-.18-.461-.387-1.083-.655-1.887l-.005-.015c-.115-.345-.156-.463-.21-.564a1.5 1.5 0 0 0-.624-.625c-.1-.053-.219-.094-.564-.21l-.015-.004a46 46 0 0 1-1.887-.655c-.446-.175-.82-.35-1.062-.583a2.5 2.5 0 0 1 0-3.606c.243-.233.616-.408 1.062-.583c.461-.18 1.083-.387 1.887-.655l.015-.005l6.491-2.163l.041-.014c.793-.264 1.442-.48 1.947-.57" clip-rule="evenodd"/></svg>
            </button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backBtn = document.getElementById('back-btn');
            const sendBtn = document.getElementById('send-btn');
            const messageInput = document.getElementById('message-input');
            const chatMessages = document.getElementById('chat-messages');
            const STORAGE_KEY = 'chat_messages';
            
            var charName = 'Char';
            var userName = 'You';
            var systemPrompt = '';
            var apiConfig = null;
            
            function loadProfiles() {
                var charData = localStorage.getItem('profile_char');
                var userData = localStorage.getItem('profile_user');
                if (charData) {
                    try {
                        var c = JSON.parse(charData);
                        if (c.name) charName = c.name;
                        if (c.settings) systemPrompt = c.settings;
                    } catch(e) {}
                }
                if (userData) {
                    try {
                        var u = JSON.parse(userData);
                        if (u.name) userName = u.name;
                    } catch(e) {}
                }
                var preset = localStorage.getItem('default_api_preset');
                if (preset) {
                    try { apiConfig = JSON.parse(preset); } catch(e) {}
                }
            }
            
            function buildSystemPrompt() {
                var prompt = '你是' + charName + '。';
                if (systemPrompt) {
                    prompt += '\n\n你的人设设定：\n' + systemPrompt;
                }
                prompt += '\n\n请以' + charName + '的身份和我聊天，保持人设统一，语气自然，像真人一样对话，不要机械问答。';
                return prompt;
            }
            
            function loadMessages() {
                var saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        var messages = JSON.parse(saved);
                        chatMessages.innerHTML = '';
                        messages.forEach(function(msg) {
                            var el = document.createElement('div');
                            el.className = 'message ' + msg.role;
                            el.innerHTML = '<div class="message-content"><div class="message-text">' + msg.text + '</div></div>';
                            chatMessages.appendChild(el);
                        });
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    } catch(e) {}
                }
            }
            
            function saveMessage(text, role) {
                var messages = [];
                var saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { messages = JSON.parse(saved); } catch(e) {}
                }
                messages.push({ text: text, role: role, time: new Date().toISOString() });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
            }
            
            function buildApiMessages() {
                var msgs = [{ role: 'system', content: buildSystemPrompt() }];
                var saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        var history = JSON.parse(saved);
                        history.forEach(function(m) {
                            msgs.push({
                                role: m.role === 'sent' ? 'user' : 'assistant',
                                content: m.text
                            });
                        });
                    } catch(e) {}
                }
                return msgs;
            }
            
            function callApi(userText) {
                if (!apiConfig || !apiConfig.url || !apiConfig.key) {
                    var replyEl = document.createElement('div');
                    replyEl.className = 'message received';
                    replyEl.innerHTML = '<div class="message-content"><div class="message-text">请先在设置中配置 API</div></div>';
                    chatMessages.appendChild(replyEl);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    return;
                }
                
                var apiUrl = apiConfig.url.replace(/\/+$/, '') + '/chat/completions';
                var model = apiConfig.selectedModel || (apiConfig.models && apiConfig.models[0]) || 'gpt-3.5-turbo';
                var messages = buildApiMessages();
                
                var loadingEl = document.createElement('div');
                loadingEl.className = 'message received';
                loadingEl.innerHTML = '<div class="message-content"><div class="message-text">' + charName + ' 正在输入...</div></div>';
                chatMessages.appendChild(loadingEl);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiConfig.key
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messages
                    })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var reply = '';
                    if (data.choices && data.choices.length > 0) {
                        reply = data.choices[0].message.content;
                    } else if (data.error) {
                        reply = '错误: ' + data.error.message;
                    } else {
                        reply = '未能获取回复';
                    }
                    
                    loadingEl.remove();
                    saveMessage(reply, 'received');
                    var replyEl = document.createElement('div');
                    replyEl.className = 'message received';
                    replyEl.innerHTML = '<div class="message-content"><div class="message-text">' + reply + '</div></div>';
                    chatMessages.appendChild(replyEl);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                })
                .catch(function(err) {
                    loadingEl.remove();
                    var errEl = document.createElement('div');
                    errEl.className = 'message received';
                    errEl.innerHTML = '<div class="message-content"><div class="message-text">请求失败: ' + err.message + '</div></div>';
                    chatMessages.appendChild(errEl);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                });
            }
            
            loadProfiles();
            loadMessages();
            
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    window.location.replace('chat.html');
                });
            }
            
            sendBtn.addEventListener('click', function() {
                var messageText = messageInput.value.trim();
                if (messageText) {
                    saveMessage(messageText, 'sent');
                    var el = document.createElement('div');
                    el.className = 'message sent';
                    el.innerHTML = '<div class="message-content"><div class="message-text">' + messageText + '</div></div>';
                    chatMessages.appendChild(el);
                    messageInput.value = '';
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    callApi(messageText);
                }
            });
            
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendBtn.click();
                }
            });
        });
    </script>
</body>
</html>
