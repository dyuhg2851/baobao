<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="chat-room.css">
    <title>Chat Room</title>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <button id="back-btn" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"/></svg>
            </button>
            <div class="header-center">
                <div class="avatar-row">
                    <div class="avatar-block">
                        <div class="avatar user-avatar" id="chat-user-avatar"></div>
                        <div class="avatar-label" id="chat-user-name">You</div>
                    </div>
                    <div class="avatar-block">
                        <div class="avatar char-avatar" id="chat-char-avatar"></div>
                        <div class="avatar-label" id="chat-char-name">Char</div>
                    </div>
                </div>
            </div>
            <button id="voice-btn" class="voice-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m12 5.5l-.54.52a.75.75 0 0 0 1.08 0zM8.962 18.91l-.465.59zM7 16.42a.75.75 0 0 0-.954 1.16zm-4.659-3.009a.75.75 0 1 0 1.316-.72zm15.829 6.758l-.45-.6zm2.976-7.251l.543-.518zm-4.647.24l-.527.534a.75.75 0 0 0 1.054 0zm-1.67 7.011l.449-.6zm-2.977-7.251l.542.518zm7.594 7.243a.75.75 0 0 0-.893-1.205zm1.402-3.517a.75.75 0 1 0 1.32.712zm.249-3.777l-.53.53zM2.75 9.137c0-2.15 1.215-3.954 2.874-4.713c1.612-.737 3.778-.541 5.836 1.597l1.08-1.04C10.1 2.444 7.264 2.025 5 3.06C2.786 4.073 1.25 6.425 1.25 9.137zM8.497 19.5c.513.404 1.063.834 1.62 1.16s1.193.59 1.883.59v-1.5c-.31 0-.674-.12-1.126-.385c-.453-.264-.922-.628-1.448-1.043zM22.75 9.137c0-2.712-1.535-5.064-3.75-6.077c-2.264-1.035-5.098-.616-7.54 1.92l1.08 1.04c2.058-2.137 4.224-2.333 5.836-1.596c1.659.759 2.874 2.562 2.874 4.713zM9.426 18.322c-.796-.627-1.605-1.226-2.425-1.901l-.954 1.158c.83.683 1.708 1.335 2.45 1.92zm-5.768-5.63a7.25 7.25 0 0 1-.908-3.555h-1.5c0 1.638.42 3.046 1.092 4.275zm14.063 6.877a7 7 0 0 1-.758.52c-.225.125-.369.161-.463.161v1.5c.456 0 .861-.166 1.192-.35c.33-.182.65-.422.929-.63zm5.029-4.51a3.84 3.84 0 0 0-1.06-2.66l-1.085 1.037c.397.415.645.987.645 1.624zm-8.37 5.71c.278.21.599.449.928.632s.736.349 1.192.349v-1.5c-.094 0-.238-.036-.463-.16a7 7 0 0 1-.758-.521zm-2.63-5.71c0-.636.248-1.207.645-1.623L11.31 12.4a3.84 3.84 0 0 0-1.06 2.66zm.645-1.623a2.18 2.18 0 0 1 1.565-.686c.595-.003 1.304.242 2.013.942l1.054-1.067c-.953-.941-2.03-1.38-3.074-1.375a3.68 3.68 0 0 0-2.643 1.15zm6.226 7.333c.267-.2.527-.386.826-.608l-.893-1.205c-.27.199-.57.416-.833.613zm3.548-3.413a4.76 4.76 0 0 0 .581-2.297h-1.5c0 .605-.15 1.122-.4 1.585zm-6.89 2.213c-.238-.178-.496-.365-.74-.544l-.89 1.207c.26.191.498.363.73.537zm-.74-.544c-1.512-1.115-2.789-2.214-2.789-3.965h-1.5c0 2.594 1.953 4.106 3.4 5.172zm-.878-.009c-.691.49-1.218.734-1.661.734v1.5c.945 0 1.806-.498 2.528-1.01zM21.69 12.4l-.062-.063l-1.06 1.06l.037.038zm-.062-.063A3.67 3.67 0 0 0 19 11.25c-1.03.008-2.089.448-3.027 1.375l1.054 1.067c.699-.69 1.396-.937 1.985-.942a2.17 2.17 0 0 1 1.556.648zm.137.874a8.74 8.74 0 0 0 .985-4.074h-1.5c0 1.293-.31 2.403-.818 3.386z"/></svg>
            </button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message received">
                <div class="message-content">
                    <div class="message-text">Hello! How can I help you today?</div>
                </div>
            </div>
            <div class="message sent">
                <div class="message-content">
                    <div class="message-text">Hi! I'm looking for some advice.</div>
                </div>
            </div>
            <div class="message received">
                <div class="message-content">
                    <div class="message-text">Of course! Feel free to ask me anything.</div>
                </div>
            </div>
        </div>
        
        <div class="chat-input">
            <input type="text" id="message-input" class="message-input" placeholder="Type a message...">
            <button id="send-btn" class="send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="#ffffff" d="M2.01 21L23 12L2.01 3L2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    window.location.replace('chat.html');
                });
            }
            
            // 加载档案资料
            const loadProfileData = () => {
                const charData = localStorage.getItem('profile_char');
                const userData = localStorage.getItem('profile_user');
                const charNameElement = document.getElementById('chat-char-name');
                const charAvatarElement = document.getElementById('chat-char-avatar');
                const userNameElement = document.getElementById('chat-user-name');
                const userAvatarElement = document.getElementById('chat-user-avatar');

                if (charData) {
                    try {
                        const data = JSON.parse(charData);
                        if (data.name && charNameElement) {
                            charNameElement.textContent = data.name;
                        }
                        if (data.avatar && charAvatarElement) {
                            charAvatarElement.style.backgroundImage = `url(${data.avatar})`;
                        }
                    } catch (e) {
                        console.error('解析 profile_char 失败', e);
                    }
                }

                if (userData) {
                    try {
                        const data = JSON.parse(userData);
                        if (data.name && userNameElement) {
                            userNameElement.textContent = data.name;
                        }
                        if (data.avatar && userAvatarElement) {
                            userAvatarElement.style.backgroundImage = `url(${data.avatar})`;
                        }
                    } catch (e) {
                        console.error('解析 profile_user 失败', e);
                    }
                }
            };
            
            loadProfileData();
            
            const sendBtn = document.getElementById('send-btn');
            const messageInput = document.getElementById('message-input');
            const chatMessages = document.getElementById('chat-messages');
            
            sendBtn.addEventListener('click', function() {
                const messageText = messageInput.value.trim();
                if (messageText) {
                    const messageElement = document.createElement('div');
                    messageElement.className = 'message sent';
                    messageElement.innerHTML = `
                        <div class="message-content">
                            <div class="message-text">${messageText}</div>
                        </div>
                    `;
                    chatMessages.appendChild(messageElement);
                    messageInput.value = '';
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            });
            
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendBtn.click();
                }
            });
        });
    </script>
</body>
</html>
