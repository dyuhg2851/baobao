            </button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message received">
                <div class="message-content">
                    <div class="message-text">Hello! How can I help you today?</div>
                </div>
            </div>
            <div class="message sent">
                <div class="message-content">
                    <div class="message-text">Hi! I'm looking for some advice.</div>
                </div>
            </div>
            <div class="message received">
                <div class="message-content">
                    <div class="message-text">Of course! Feel free to ask me anything.</div>
                </div>
            </div>
        </div>
        
        <div class="chat-input">
            <input type="text" id="message-input" class="message-input" placeholder="Type a message...">
            <button id="send-btn" class="send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="#ffffff" d="M2.01 21L23 12L2.01 3L2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    window.location.replace('chat.html');
                });
            }
            
            // Dock图标点击事件
            const dockLinks = ['../Secret/secret.html', '../Music/music.html', '../Theme/theme.html', '../Settings/Settings.html'];
            document.querySelectorAll('.dock .app-icon').forEach((icon, index) => {
                if (dockLinks[index]) {
                    icon.addEventListener('click', () => window.location.href = dockLinks[index]);
                }
            });
            
            // 加载Char资料
            const loadCharProfile = () => {
                const savedData = localStorage.getItem('profile_char');
                if (savedData) {
                    const data = JSON.parse(savedData);
                    const nameElement = document.querySelector('.chat-header .character-name');
                    
                    if (data.name && nameElement) {
                        nameElement.textContent = data.name;
                    }
                }
            };
            
            loadCharProfile();
            
            const sendBtn = document.getElementById('send-btn');
            const messageInput = document.getElementById('message-input');
            const chatMessages = document.getElementById('chat-messages');
            
            sendBtn.addEventListener('click', function() {
                const messageText = messageInput.value.trim();
                if (messageText) {
                    const messageElement = document.createElement('div');
                    messageElement.className = 'message sent';
                    messageElement.innerHTML = `
                        <div class="message-content">
                            <div class="message-text">${messageText}</div>
                        </div>
                    `;
                    chatMessages.appendChild(messageElement);
                    messageInput.value = '';
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            });
            
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendBtn.click();
                }
            });
        });
    </script>
</body>
</html>
