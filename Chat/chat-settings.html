<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="chat-settings.css">
    <script src="moment-api.js" defer></script>
    <script src="chat-notification.js" defer></script>
    <title>Chat Settings</title>
</head>
<body>
    <div class="settings-container">
        <div class="header">
            <button id="back-btn" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"/></svg>
            </button>
            <h1>聊天设置</h1>
        </div>
        
        <div class="page-content">

        <!-- 角色昵称 -->
        <div class="card">
            <h2>备注</h2>
            <div class="form-group">
                <input type="text" id="char-nickname" class="form-input" placeholder="Enter nickname...">
            </div>
            <div class="button-group">
                <button id="btn-nickname-save" class="btn btn-save">Save</button>
                <button id="btn-nickname-reset" class="btn btn-delete">Reset</button>
            </div>
        </div>

        <!-- Chat Background -->
        <div class="card">
            <h2>聊天背景</h2>
            <div class="bg-preview" id="bg-preview">
                <div class="bg-preview-inner" id="bg-preview-inner">Preview</div>
            </div>
            <div class="button-group">
                <button id="btn-bg-set" class="btn btn-save">Set Background</button>
                <button id="btn-bg-reset" class="btn btn-delete">Reset</button>
            </div>
        </div>

        <!-- Memory -->
        <div class="card">
            <h2>记忆</h2>
            <div class="button-group">
                <button id="btn-summarize" class="btn btn-save">Summarize & Save Memory</button>
            </div>
            
            <div id="memory-result" class="memory-result" style="display:none">
                <label>Generated Memory</label>
                <textarea id="memory-content" class="form-textarea" rows="4" placeholder="Generated memory will appear here..."></textarea>
                <div class="button-group">
                    <button id="btn-memory-save" class="btn btn-save">Save Memory</button>
                    <button id="btn-memory-clear" class="btn btn-delete">Clear Memory</button>
                </div>
            </div>
            
            <div class="button-group" style="margin-top: 16px;">
                <button id="btn-view-memory" class="btn btn-save">View Memory</button>
            </div>
        </div>

        <!-- 拉黑角色 -->
        <div class="card">
            <h2>拉黑角色</h2>
            <div class="form-group toggle-row">
                <label>拉黑角色</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="block-char">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <!-- 数据管理 -->
        <div class="card">
            <h2>数据管理</h2>
            <div class="button-group">
                <button id="btn-clear-chat" class="btn btn-delete">清除聊天记录</button>
            </div>
        </div>

        <!-- 预设管理 -->
        <div class="card">
            <h2>预设管理</h2>
            <div class="preset-list" id="preset-list"></div>
        </div> <!-- page-content -->
    </div> <!-- settings-container -->

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    window.location.replace('chat-room.html');
                });
            }

            // Load saved settings
            loadSettings();

            // Nickname
            document.getElementById('btn-nickname-save').addEventListener('click', function() {
                var nickname = document.getElementById('char-nickname').value;
                if (nickname) {
                    localStorage.setItem('char_nickname', nickname);
                    alert('Nickname saved!');
                }
            });
            document.getElementById('btn-nickname-reset').addEventListener('click', function() {
                localStorage.removeItem('char_nickname');
                document.getElementById('char-nickname').value = '';
                alert('Nickname reset.');
            });

            // Background
            document.getElementById('btn-bg-set').addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const dataUrl = e.target.result;
                        localStorage.setItem('chat_bg', dataUrl);
                        updateBgPreview(dataUrl);
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            });

            document.getElementById('btn-bg-reset').addEventListener('click', function() {
                localStorage.removeItem('chat_bg');
                updateBgPreview(null);
            });

            // Block Char
            document.getElementById('block-char').addEventListener('change', function() {
                localStorage.setItem('chat_block_char', this.checked);
            });

            // Summarize
            document.getElementById('btn-summarize').addEventListener('click', async function() {
                const summaryPrompt = document.getElementById('memory-summary-prompt').value;
                const chatData = JSON.parse(localStorage.getItem('chat_messages') || '[]');
                
                if (chatData.length === 0) {
                    alert('No chat history to summarize.');
                    return;
                }

                const charData = JSON.parse(localStorage.getItem('profile_char') || '{}');
                const nickname = localStorage.getItem('char_nickname') || charData.name || 'Char';
                const chatText = chatData.map(c => 
                    (c.role === 'sent' ? 'User' : nickname) + ': ' + c.text
                ).join('\n');

                const defaultPrompt = 'Summarize the key information, personality traits, preferences, and relationship dynamics revealed in this conversation. Output as concise character memory notes.';
                const finalPrompt = summaryPrompt || defaultPrompt;

                document.getElementById('btn-summarize').textContent = 'Summarizing...';
                document.getElementById('btn-summarize').disabled = true;

                try {
                    const result = await callChatAPI([
                        { role: 'system', content: finalPrompt },
                        { role: 'user', content: 'Conversation:\n' + chatText }
                    ], { maxTokens: 300, temperature: 0.7 });

                    if (result) {
                        document.getElementById('memory-result').style.display = 'block';
                        document.getElementById('memory-content').value = result;
                    } else {
                        alert('Failed to summarize. Check API settings.');
                    }
                } catch (err) {
                    alert('Failed to summarize: ' + err.message);
                } finally {
                    document.getElementById('btn-summarize').textContent = 'Summarize & Save Memory';
                    document.getElementById('btn-summarize').disabled = false;
                }
            });

            // Memory save / clear
            document.getElementById('btn-memory-save').addEventListener('click', function() {
                var memory = document.getElementById('memory-content').value;
                if (memory) {
                    var memoryData = {
                        content: memory,
                        timestamp: Date.now()
                    };
                    localStorage.setItem('char_memory', JSON.stringify(memoryData));
                    alert('Memory saved!');
                }
            });

            document.getElementById('btn-memory-clear').addEventListener('click', function() {
                localStorage.removeItem('char_memory');
                document.getElementById('memory-content').value = '';
                document.getElementById('memory-result').style.display = 'none';
                alert('Memory cleared.');
            });

            // View Memory
            document.getElementById('btn-view-memory').addEventListener('click', function() {
                window.location.href = 'memory-world.html';
            });

            // Clear chat
            document.getElementById('btn-clear-chat').addEventListener('click', function() {
                if (confirm('Clear all chat history? This will delete the conversation.')) {
                    localStorage.removeItem('chat_messages');
                    alert('Chat history cleared.');
                }
            });

            function loadSettings() {
                // Nickname
                var nickname = localStorage.getItem('char_nickname');
                if (nickname) document.getElementById('char-nickname').value = nickname;

                // Background
                const bg = localStorage.getItem('chat_bg');
                if (bg) updateBgPreview(bg);

                // Block
                const blocked = localStorage.getItem('chat_block_char') === 'true';
                document.getElementById('block-char').checked = blocked;

                // Memory
                var memoryData = localStorage.getItem('char_memory');
                if (memoryData) {
                    try {
                        var parsed = JSON.parse(memoryData);
                        document.getElementById('memory-content').value = parsed.content || '';
                        document.getElementById('memory-result').style.display = 'block';
                    } catch(e) {
                        // Old format - plain text
                        document.getElementById('memory-content').value = memoryData;
                        document.getElementById('memory-result').style.display = 'block';
                    }
                }

                // Summary prompt
                const savedPrompt = localStorage.getItem('memory_summary_prompt');
                if (savedPrompt) document.getElementById('memory-summary-prompt').value = savedPrompt;
            }

            function updateBgPreview(dataUrl) {
                const preview = document.getElementById('bg-preview-inner');
                if (dataUrl) {
                    preview.style.backgroundImage = 'url(' + dataUrl + ')';
                    preview.style.backgroundSize = 'cover';
                    preview.style.backgroundPosition = 'center';
                    preview.textContent = '';
                } else {
                    preview.style.backgroundImage = '';
                    preview.textContent = 'Default';
                }
            }

            // Save summary prompt on change
            document.getElementById('memory-summary-prompt').addEventListener('change', function() {
                localStorage.setItem('memory_summary_prompt', this.value);
            });

            // Preset management
            loadPresetsList();

            function loadPresetsList() {
                const presetListEl = document.getElementById('preset-list');
                try {
                    const presets = JSON.parse(localStorage.getItem('chat_theme_presets') || '{}');
                    const presetNames = Object.keys(presets);
                    
                    if (presetNames.length === 0) {
                        presetListEl.innerHTML = '<div class="preset-empty">暂无预设</div>';
                        return;
                    }
                    
                    presetListEl.innerHTML = presetNames.map(name => `
                        <div class="preset-item">
                            <span class="preset-item-name">${escapeHtml(name)}</span>
                            <button class="preset-delete-btn" onclick="deletePreset('${escapeHtml(name)}')">删除</button>
                        </div>
                    `).join('');
                } catch(e) {
                    presetListEl.innerHTML = '<div class="preset-empty">暂无预设</div>';
                }
            }

            window.deletePreset = function(name) {
                if (!name) return;
                if (confirm('确定要删除预设 "' + name + '" 吗？')) {
                    try {
                        const presets = JSON.parse(localStorage.getItem('chat_theme_presets') || '{}');
                        delete presets[name];
                        localStorage.setItem('chat_theme_presets', JSON.stringify(presets));
                        loadPresetsList();
                        alert('预设已删除');
                    } catch(e) {
                        alert('删除失败');
                    }
                }
            };

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        });
    </script>
</body>
</html>
