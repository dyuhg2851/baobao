<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="Settings.css">
    <link rel="stylesheet" href="../style.css">
    <title>设置</title>
    <script>
        // 加载保存的字体
        window.addEventListener('load', function() {
            const savedFont = localStorage.getItem('current_font');
            if (savedFont) {
                const font = JSON.parse(savedFont);
                if (font.url) {
                    // 移除旧的字体样式
                    const oldFontStyle = document.getElementById('custom-font-style');
                    if (oldFontStyle) {
                        oldFontStyle.remove();
                    }
                    
                    // 创建新的样式标签，使用@font-face加载TTF字体
                    const fontStyle = document.createElement('style');
                    fontStyle.id = 'custom-font-style';
                    
                    // 使用保存的字体名称或生成唯一名称
                    const fontName = font.family || font.name || 'CustomFont';
                    
                    // 构建@font-face规则
                    const fontFaceRule = `
                        @font-face {
                            font-family: '${fontName}';
                            src: url('${font.url}') format('truetype');
                            font-weight: normal;
                            font-style: normal;
                        }
                    `;
                    
                    fontStyle.textContent = fontFaceRule;
                    document.head.appendChild(fontStyle);
                    
                    // 应用字体
                    document.body.style.fontFamily = fontName;
                } else if (font.family) {
                    document.body.style.fontFamily = font.family;
                }
            }
        });
    </script>
</head>
<body>
    <div class="settings-container">
        <div class="header">
            <button id="back-btn" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"/></svg>
            </button>
            <h1>Settings</h1>
        </div>
        
        <!-- API配置卡片 -->
        <div class="card">
            <h2>API设置</h2>
            
            <!-- 预设选择 -->
            <div class="form-group">
                <label for="api-preset">API预设</label>
                <select id="api-preset" class="form-input">
                    <option value="">选择预设</option>
                </select>
            </div>
            
            <!-- API URL -->
            <div class="form-group">
                <label for="api-url">API URL</label>
                <input type="text" id="api-url" class="form-input" placeholder="输入API地址">
            </div>
            
            <!-- API Key -->
            <div class="form-group">
                <label for="api-key">API Key</label>
                <input type="password" id="api-key" class="form-input" placeholder="输入API密钥">
            </div>
            
            <!-- 模型列表 -->
            <div class="form-group">
                <label for="api-model">模型</label>
                <select id="api-model" class="form-input">
                    <option value="">选择模型</option>
                </select>
            </div>
            
            <!-- 按钮组 -->
            <div class="button-group">
                <button id="btn-delete" class="btn btn-delete">Delete</button>
                <button id="btn-save" class="btn btn-save">Save</button>
                <button id="btn-pull" class="btn btn-pull">Pull</button>
                <button id="btn-add" class="btn btn-add">Add</button>
            </div>
        </div>
        
        <!-- 数据卡片 -->
        <div class="card">
            <h2>数据</h2>
            
            <!-- 导出和导入按钮 -->
            <div class="button-group">
                <button id="btn-export" class="btn btn-save">Export all data</button>
                <button id="btn-import" class="btn btn-save">Import data</button>
            </div>
            
            <!-- 清除数据按钮 -->
            <div class="button-group">
                <button id="btn-clear" class="btn btn-delete">Clear the data</button>
            </div>
        </div>
    </div>
    
    <!-- 弹窗 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>添加预设</h3>
            <div class="form-group">
                <label for="preset-name">预设名称</label>
                <input type="text" id="preset-name" class="form-input" placeholder="输入预设名称">
            </div>
            <div class="modal-buttons">
                <button id="modal-cancel" class="btn btn-cancel">Cancle</button>
                <button id="modal-confirm" class="btn btn-confirm">Confirm</button>
            </div>
        </div>
    </div>
    
    <!-- 音乐悬浮窗 -->
    <div class="music-float" id="music-float" style="display: none;">
        <div class="fixed-player-card">
            <div class="float-content">
                <div class="float-vinyl">
                    <div class="float-vinyl-record" id="float-vinyl-record">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect fill='%23e0e0e0' width='60' height='60'/%3E%3Ctext fill='%23999' font-family='Arial' font-size='12' x='50%25' y='50%25' text-anchor='middle' dominant-baseline='middle'%3EAlbum%3C/text%3E%3C/svg%3E" alt="封面" id="float-cover">
                    </div>
                </div>
                <div class="float-info">
                    <div class="float-song-name" id="float-song-name"></div>
                    <div class="float-lyric" id="float-lyric"></div>
                </div>
                <div class="float-close" id="float-close">×</div>
            </div>
        </div>
    </div>
    
    <script src="Settings.js"></script>
    <script>
        // 引入音乐悬浮窗公共脚本
        const script = document.createElement('script');
        script.src = '../music-float.js';
        script.async = false;
        document.head.appendChild(script);
    </script>
</body>
</html>
