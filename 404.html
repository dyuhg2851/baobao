<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="晕倒料理">
    <title>晕倒料理</title>
    <link rel="apple-touch-icon" href="https://i.postimg.cc/Jn63yqvs/IMG-9251.jpg">
    <link rel="icon" href="https://i.postimg.cc/Jn63yqvs/IMG-9251.jpg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
    <div class="main-screen">
        <div class="slide-container">
            <div class="slide-page">
                <div class="app-grid">
                    <div class="app-item" onclick="openWechatPage()">
                        <div class="dock-icon"><img src="https://i.postimg.cc/pLWZSKkg/IMG-9922.png" alt="微信" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">微信</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/DzSFhJBF/IMG-9940.png" alt="家庭" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">家庭</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon full-icon"><img src="https://i.postimg.cc/HkWL7Ls8/quality-restoration-20260321211820358.png" alt="查找" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">查找</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/3x5q8B5P/quality-restoration-20260321211354709.png" alt="照片" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">照片</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/4x5k7p1N/quality-restoration-20260321211459695.png" alt="相机" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">相机</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/KY75Sf50/quality-restoration-20260321211529568.png" alt="天气" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">天气</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/9M47w61X/quality-restoration-20260321211608373.png" alt="备忘录" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">备忘录</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/02DcL8Q9/quality-restoration-20260321211638302.png" alt="时钟" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">时钟</div>
                    </div>
                    <div class="app-item" id="settings-icon">
                        <div class="dock-icon"><img src="https://i.postimg.cc/ZK59cD37/quality-restoration-20260321211719423.png" alt="设置" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">设置</div>
                    </div>
                </div>
            </div>
            <div class="slide-page">
                <div class="app-grid">
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/9XW9jLk3/quality-restoration-20260321211748339.png" alt="地图" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">地图</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/26816XfF/quality-restoration-20260321211851269.png" alt="健康" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">健康</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/jjw39CzQ/quality-restoration-20260321211917217.png" alt="提醒事项" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">提醒事项</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/d3n4Zb4g/quality-restoration-20260321211945146.png" alt="语音备忘录" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">语音备忘录</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/28VY9s9V/quality-restoration-20260321212016083.png" alt="股票" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">股票</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/25jD5T0S/quality-restoration-20260321212043004.png" alt="计算器" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">计算器</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/59k26v0M/quality-restoration-20260321212112933.png" alt="指南针" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">指南针</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/CKpL7L0f/quality-restoration-20260321212144851.png" alt="播客" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">播客</div>
                    </div>
                    <div class="app-item">
                        <div class="dock-icon"><img src="https://i.postimg.cc/J462K75m/quality-restoration-20260321212211776.png" alt="App Store" loading="lazy" width="36" height="36"></div>
                        <div class="app-label">App Store</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="page-indicators">
            <div class="indicator-dot active"></div>
            <div class="indicator-dot"></div>
        </div>
        <div class="bottom-dock">
            <div class="dock-item active">
                <div class="dock-icon"><img src="https://i.postimg.cc/3w5Z7B75/quality-restoration-20260321212241710.png" alt="主屏幕" loading="lazy" width="40" height="40"></div>
            </div>
            <div class="dock-item">
                <div class="dock-icon"><img src="https://i.postimg.cc/15RgQ11P/quality-restoration-20260321212309638.png" alt="Siri" loading="lazy" width="40" height="40"></div>
            </div>
            <div class="dock-item">
                <div class="dock-icon"><img src="https://i.postimg.cc/BbY9Bk9j/quality-restoration-20260321212336563.png" alt="搜索" loading="lazy" width="40" height="40"></div>
            </div>
            <div class="dock-item">
                <div class="dock-icon"><img src="https://i.postimg.cc/DfV3W34M/quality-restoration-20260321212407487.png" alt="控制中心" loading="lazy" width="40" height="40"></div>
            </div>
        </div>
    </div>
    
    <!-- 设置页面 -->
    <div id="settings-page" class="settings-page">
        <!-- 顶部导航栏 -->
        <div class="settings-header">
            <div class="back-button" onclick="goBack()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </div>
            <h1 class="settings-title">设置</h1>
            <div class="header-right"></div>
        </div>
        
        <!-- 个人信息模块 -->
        <div class="profile-section">
            <div class="profile-avatar" onclick="changeAvatar(event)">
                <img id="avatar-image" src="https://i.postimg.cc/DzSFhJBF/IMG-9940.png" alt="头像" width="64" height="64">
            </div>
            <div class="profile-info">
                <div class="profile-name" onclick="editName(event)">Wenbaby</div>
                <div class="profile-desc" onclick="editDescription(event)">我是Wenbaby，你呢？</div>
            </div>
        </div>
        
        <!-- AI设置模块 -->
        <div class="settings-group">
            <div class="settings-group-title">AI设置</div>
            <div class="settings-item">
                <div class="settings-label">模型选择</div>
                <div class="settings-value">
                    <select id="model-select" class="settings-select">
                        <option value="deepseek-v3.1-terminus">DeepSeek V3.1</option>
                        <option value="kimi-k2">Kimi K2</option>
                        <option value="doubao-1.6-pro-256k">Doubao 1.6 Pro</option>
                    </select>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-label">API URL</div>
                <div class="settings-value">
                    <input type="text" id="api-url" placeholder="输入API URL" class="settings-input">
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-label">API Key</div>
                <div class="settings-value">
                    <input type="password" id="api-key" placeholder="输入API Key" class="settings-input">
                </div>
            </div>
            <div class="settings-item horizontal buttons-row">
                <button class="settings-button" onclick="fetchModels()">拉取模型</button>
                <button class="settings-button" onclick="openAddApiPresetDialog()">添加API预设</button>
            </div>
            
            <!-- API预设部分 -->
            <div class="settings-group-title">API预设</div>
            <div id="api-preset-list" class="preset-avatars">
                <!-- API预设列表将动态生成 -->
            </div>
        </div>
        
        <!-- 显示设置模块 -->
        <div class="settings-group">
            <div class="settings-group-title">显示设置</div>
            <div class="settings-item">
                <div class="settings-label">字体</div>
                <div class="settings-value">
                    <input type="url" id="font-url" placeholder="输入字体链接" class="settings-input">
                </div>
            </div>
            <div class="settings-item horizontal buttons-row">
                <button class="settings-button" onclick="applyFont()">应用字体</button>
                <button class="settings-button" onclick="removeFont()">移除字体</button>
            </div>
            
            <!-- 字体预设部分 -->
            <div class="settings-group-title">字体预设</div>
            <div id="font-preset-list" class="preset-avatars">
                <!-- 字体预设列表将动态生成 -->
            </div>
        </div>
        
        <!-- 自定义CSS美化模块 -->
        <div class="settings-group">
            <div class="settings-group-title">自定义CSS美化</div>
            <div class="settings-item vertical">
                <div class="settings-label">CSS代码</div>
                <div class="settings-textarea-container">
                    <textarea id="custom-css" placeholder="输入自定义CSS代码" class="settings-textarea"></textarea>
                </div>
            </div>
            <div class="settings-item horizontal buttons-row">
                <button class="settings-button" onclick="applyCustomCSS()">应用CSS</button>
                <button class="settings-button" onclick="removeCustomCSS()">移除CSS</button>
            </div>
            
            <!-- CSS预设部分 -->
            <div class="settings-group-title">CSS预设</div>
            <div id="css-preset-list" class="preset-avatars">
                <!-- CSS预设列表将动态生成 -->
            </div>
        </div>
        
        <!-- 添加API预设弹窗 -->
        <div id="add-api-preset-dialog" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>添加API预设</h3>
                    <button class="modal-close" onclick="closeAddApiPresetDialog()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="modal-form-item">
                        <label>预设名称</label>
                        <input type="text" id="api-preset-name" placeholder="输入预设名称">
                    </div>
                    <div class="modal-form-item">
                        <label>API URL</label>
                        <input type="url" id="api-preset-url" placeholder="输入API URL">
                    </div>
                    <div class="modal-form-item">
                        <label>API Key</label>
                        <input type="password" id="api-preset-key" placeholder="输入API Key">
                    </div>
                    <div class="modal-actions">
                        <button class="modal-button cancel" onclick="closeAddApiPresetDialog()">取消</button>
                        <button class="modal-button confirm" onclick="saveApiPreset()">保存</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 添加字体预设弹窗 -->
        <div id="add-font-preset-dialog" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>添加字体预设</h3>
                    <button class="modal-close" onclick="closeAddFontPresetDialog()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="modal-form-item">
                        <label>预设名称</label>
                        <input type="text" id="font-preset-name" placeholder="输入预设名称">
                    </div>
                    <div class="modal-form-item">
                        <label>字体链接</label>
                        <input type="url" id="font-preset-url" placeholder="输入TTF/OTF字体链接">
                    </div>
                    <div class="modal-actions">
                        <button class="modal-button cancel" onclick="closeAddFontPresetDialog()">取消</button>
                        <button class="modal-button confirm" onclick="saveFontPreset()">保存</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 添加CSS预设弹窗 -->
        <div id="add-css-preset-dialog" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>添加CSS预设</h3>
                    <button class="modal-close" onclick="closeAddCssPresetDialog()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="modal-form-item">
                        <label>预设名称</label>
                        <input type="text" id="css-preset-name" placeholder="输入预设名称">
                    </div>
                    <div class="modal-form-item">
                        <label>CSS代码</label>
                        <textarea id="css-preset-code" placeholder="输入CSS代码" class="modal-textarea"></textarea>
                    </div>
                    <div class="modal-actions">
                        <button class="modal-button cancel" onclick="closeAddCssPresetDialog()">取消</button>
                        <button class="modal-button confirm" onclick="saveCssPreset()">保存</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 通用页面 -->
    <div id="general-page" class="settings-page">
        <!-- 顶部导航栏 -->
        <div class="settings-header">
            <div class="back-button" onclick="goBackFromGeneral()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </div>
            <h1 class="settings-title">通用</h1>
            <div class="header-right"></div>
        </div>
        
        <!-- 世界书管理模块 -->
        <div class="settings-group">
            <div class="settings-group-title">世界书管理</div>
            <div class="world-book-header">
                <h3>世界书</h3>
                <button class="add-world-book-button" onclick="openAddWorldBookDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    添加
                </button>
            </div>
            <div id="world-book-list" class="world-book-grid">
                <!-- 世界书列表将动态生成 -->
            </div>
        </div>
        
        <!-- 备份与恢复模块 -->
        <div class="settings-group" style="margin-top: auto;">
            <div class="settings-group-title">备份与恢复</div>
            <div class="settings-item" onclick="openBackupDialog()">
                <div class="settings-label">备份全部数据</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="settings-item" onclick="openRestoreDialog()">
                <div class="settings-label">从文件恢复</div>
                <div class="settings-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加世界书弹窗 -->
    <div id="add-world-book-dialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加世界书</h3>
                <button class="modal-close" onclick="closeAddWorldBookDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-form-item">
                    <label>世界书名称</label>
                    <input type="text" id="world-book-name" placeholder="输入世界书名称">
                </div>
                <div class="modal-form-item">
                    <label>世界书内容</label>
                    <textarea id="world-book-content" placeholder="输入世界书内容" rows="4"></textarea>
                </div>
                <div class="modal-form-item">
                    <label>全局使用</label>
                    <div class="settings-toggle" style="margin-left: auto;">
                        <input type="checkbox" id="world-book-global" class="toggle-input">
                        <label for="world-book-global" class="toggle-label"></label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="modal-button cancel" onclick="closeAddWorldBookDialog()">取消</button>
                    <button class="modal-button confirm" onclick="saveWorldBook()">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 编辑世界书弹窗 -->
    <div id="edit-world-book-dialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑世界书</h3>
                <button class="modal-close" onclick="closeEditWorldBookDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-form-item">
                    <label>世界书名称</label>
                    <input type="text" id="edit-world-book-name" placeholder="输入世界书名称">
                </div>
                <div class="modal-form-item">
                    <label>世界书内容</label>
                    <textarea id="edit-world-book-content" placeholder="输入世界书内容" rows="4"></textarea>
                </div>
                <div class="modal-form-item">
                    <label>全局使用</label>
                    <div class="settings-toggle" style="margin-left: auto;">
                        <input type="checkbox" id="edit-world-book-global" class="toggle-input">
                        <label for="edit-world-book-global" class="toggle-label"></label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="modal-button cancel" onclick="closeEditWorldBookDialog()">取消</button>
                    <button class="modal-button confirm" onclick="updateWorldBook()">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 备份弹窗 -->
    <div id="backup-dialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>备份数据</h3>
                <button class="modal-close" onclick="closeBackupDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-form-item">
                    <label>备份文件名</label>
                    <input type="text" id="backup-filename" value="好好吃的料理.json" placeholder="输入备份文件名">
                </div>
                <div class="modal-actions">
                    <button class="modal-button cancel" onclick="closeBackupDialog()">取消</button>
                    <button class="modal-button confirm" onclick="downloadBackup()">确认</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 恢复确认弹窗 -->
    <div id="restore-confirm-dialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>恢复数据</h3>
                <button class="modal-close" onclick="closeRestoreConfirmDialog()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 20px;">恢复将覆盖当前所有数据，是否继续？</p>
                <div class="modal-actions">
                    <button class="modal-button cancel" onclick="closeRestoreConfirmDialog()">取消</button>
                    <button class="modal-button confirm" onclick="restoreData()">继续</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 长按菜单 -->
    <div id="context-menu" class="context-menu">
        <div class="context-menu-item" onclick="deleteWorldBook()">删除</div>
    </div>
    
    <!-- 文件输入框（用于恢复） -->
    <input type="file" id="restore-file-input" accept=".json" style="display: none;">
    
    <script src="script.js?v=1.0.0"></script>
</body>
</html>
