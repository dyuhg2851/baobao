<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主屏幕小组件</title>
    <link rel="stylesheet" href="widget.css">
</head>
<body>
    <div class="widget">
        <div class="avatar-container">
            <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
            <div class="avatar" id="avatar">
                <img src="https://i.postimg.cc/SxcvL0Qq/IMG-9251.jpg" alt="头像">
            </div>
        </div>
        <div class="user-info">
            <div class="nickname" id="nickname" contenteditable="true">晕了饱饱</div>
            <div class="id" id="id" contenteditable="true">@Q_iian</div>
        </div>
        <div class="content-container">
            <div class="content" id="content" contenteditable="true">拥有苹果时 只在意苹果</div>
        </div>
        <div class="emoji-container">
            <div class="emoji" id="emoji">🍎</div>
        </div>
    </div>
    <script src="widget.js"></script>
</body>
</html>
