<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="../style.css">
    <title>Theme</title>

<body>
    <div class="settings-container">
        <div class="header">
            <button id="back-btn" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"/></svg>
            </button>
            <h1>Beautiful</h1>
        </div>
        
        <!-- 壁纸卡片 -->
        <div class="card">
            <h2>壁纸</h2>
            
            <div class="wallpaper-section">
                <div class="wallpaper-thumbnail" id="wallpaper-thumbnail">
                    <img id="current-wallpaper" src="" alt="当前壁纸">
                </div>
                <div class="wallpaper-actions">
                    <div class="blur-control">
                        <label for="blur-input">模糊度</label>
                        <input type="number" id="blur-input" min="0" max="100" value="0" placeholder="0">
                        <span class="percentage-sign">%</span>
                    </div>
                    <div class="button-group">
                        <button id="btn-save" class="btn btn-save">Save</button>
                        <button id="btn-delete" class="btn btn-delete">Delete</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 字体卡片 -->
        <div class="card">
            <h2>字体</h2>
            
            <div class="font-section">
                <div class="font-preset-group">
                    <label for="font-preset">预设字体</label>
                    <select id="font-preset">
                        <option value="">选择预设</option>
                        <!-- 预设字体将通过JS动态添加 -->
                    </select>
                </div>
                
                <div class="font-input-group">
                    <label for="font-url">字体链接</label>
                    <input type="text" id="font-url" placeholder="">
                </div>
                
                <div class="font-actions">
                    <div class="button-group">
                        <button id="font-delete" class="btn btn-delete">Delete</button>
                        <button id="font-save" class="btn btn-save">Save</button>
                        <button id="font-add" class="btn btn-add">Add</button>
                        <button id="font-clear" class="btn btn-add">Clear</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- CSS美化卡片 -->
        <div class="card">
            <h2>CSS美化</h2>
            
            <div class="css-section">
                <div class="css-preset-group">
                    <label for="css-preset">选择预设</label>
                    <select id="css-preset">
                        <option value="">Custom CSS</option>
                        <!-- 预设将通过JS动态添加 -->
                    </select>
                </div>

</textarea>
                </div>
                
                <div class="css-actions">
                    <div class="button-group">
                        <button id="css-copy" class="btn btn-copy">Copy</button>
                        <button id="css-save" class="btn btn-save">Save</button>
                        <button id="css-clear" class="btn btn-clear">Clear</button>
                        <button id="css-add" class="btn btn-add">Add</button>

                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 字体预设弹窗 -->
    <div id="font-modal" class="modal">
        <div class="modal-content">
            <h3>添加字体预设</h3>
            <input type="text" id="font-preset-name" placeholder="输入预设名称">
            <div class="modal-buttons">
                <button id="font-modal-cancel" class="btn btn-save">Cancel</button>
                <button id="font-modal-confirm" class="btn btn-add">Confirm</button>
            </div>
        </div>
    </div>
    
    <!-- CSS预设弹窗 -->
    <div id="css-modal" class="modal">
        <div class="modal-content">
            <h3>保存为预设</h3>
            <input type="text" id="css-preset-name" placeholder="输入预设名称">
            <div class="modal-buttons">
                <button id="css-modal-cancel" class="btn btn-save">Cancel</button>
                <button id="css-modal-confirm" class="btn btn-add">Confirm</button>
            </div>
        </div>
    </div>
    
    <script src="theme.js"></script>
