        <!-- 铃声卡片 - 独立放置，不嵌套在CSS卡片内 -->
        <div class="card ringtone-card">
            <h2>铃声</h2>
            
            <div class="ringtone-section">
                <div class="ringtone-upload-group">
                    <label for="ringtone-file">上传铃声</label>
                    <input type="file" id="ringtone-file" accept="audio/mp3">
                    <div class="ringtone-file-name" id="ringtone-file-name"></div>
                </div>
                
                <div class="ringtone-preview-group">
                    <label>当前铃声</label>
                    <div class="ringtone-preview" id="ringtone-preview">
                        <span class="ringtone-name" id="ringtone-name">未设置</span>
                        <button id="ringtone-play" class="btn btn-play">播放</button>
                        <button id="ringtone-stop" class="btn btn-stop">停止</button>
                    </div>
                </div>
                
                <div class="ringtone-actions">
                    <div class="button-group">
                        <button id="ringtone-delete" class="btn btn-delete">Delete</button>
                        <button id="ringtone-save" class="btn btn-save">Save</button>
                    </div>
                </div>

            <div class="modal-buttons">

                <button id="css-modal-confirm" class="btn btn-add">Confirm</button>
