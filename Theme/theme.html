<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="theme.css">
    <title>Theme</title>
</head>
<body>
    <div class="theme-container">
        <div class="header">
            <button id="back-btn" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24"><path fill="#000000" d="m9.55 12l7.35 7.35q.375.375.363.875t-.388.875t-.875.375t-.875-.375l-7.7-7.675q-.3-.3-.45-.675t-.15-.75t.15-.75t.45-.675l7.7-7.7q.375-.375.888-.363t.887.388t.375.875t-.375.875z"/></svg>
            </button>
            <h1>Beautiful</h1>
        </div>
        
        <!-- 壁纸卡片 -->
        <div class="card">
            <h2>壁纸</h2>
            
            <div class="wallpaper-section">
                <div class="wallpaper-thumbnail" id="wallpaper-thumbnail">
                    <img id="current-wallpaper" src="" alt="当前壁纸">
                </div>
                <div class="wallpaper-actions">
                    <div class="blur-control">
                        <label for="blur-input">模糊度</label>
                        <input type="number" id="blur-input" min="0" max="100" value="0" placeholder="0">
                        <span class="percentage-sign">%</span>
                    </div>
                    <div class="button-group">
                        <button id="btn-save" class="btn btn-save">Save</button>
                        <button id="btn-delete" class="btn btn-delete">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="theme.js"></script>
</body>
</html>
